<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img">
<title>Left: the coverage as the explained units are taken out one at a time. A unit stays out while the coverage holds at 90% of its full value, and goes back in otherwise. 21 units remain. Right: kept alone, the heads bring back 23.4% and the neuron poles 1.9%; together 81.9%.</title>
