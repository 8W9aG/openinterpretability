</g>
<g class="s2">
<rect class="fc1" x="538.0" y="296.0" width="12" height="12" rx="2"/>
<text x="554.0" y="306.0" class="small">L1/H6</text>
<rect class="fc1" x="538.0" y="252.0" width="12" height="12" rx="2"/>
<text x="554.0" y="262.0" class="small">L2/H3</text>
<rect class="fc1" x="538.0" y="208.0" width="12" height="12" rx="2"/>
<text x="554.0" y="218.0" class="small">L3/H3</text>
<path class="arrow" d="M206.0 302.0Q370.0 288.0 534.0 302.0"/>
<path class="arrow" d="M206.0 258.0Q370.0 244.0 534.0 258.0"/>
