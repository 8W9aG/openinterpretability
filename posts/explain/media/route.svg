<circle class="thin" cx="210.0" cy="372.0" r="6"/>
<text x="220.0" y="376.0" class="small">L0/N1418+</text>
<path class="arrow" d="M196.0 398.0L196.0 380.0"/>
</g>
<g class="s1">
