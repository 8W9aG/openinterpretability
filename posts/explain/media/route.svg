<circle class="thin" cx="482.0" cy="350.0" r="6"/>
<text x="492.0" y="354.0" class="small">L0/N1669+</text>
<rect class="fc1" x="552.0" y="344.0" width="12" height="12" rx="2"/>
<text x="568.0" y="354.0" class="small">L0/H0</text>
<rect class="fc1" x="476.0" y="366.0" width="12" height="12" rx="2"/>
<text x="492.0" y="376.0" class="small">L0/H1</text>
