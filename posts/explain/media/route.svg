<path class="grid" d="M60.0 170.0L680.0 170.0"/>
<text x="28.0" y="130.0" class="small">L5</text>
<path class="grid" d="M60.0 126.0L680.0 126.0"/>
<text x="80.0" y="412.0" class="head" text-anchor="middle">“The”</text>
<text x="196.0" y="412.0" class="head" text-anchor="middle">“ sun”</text>
<text x="312.0" y="412.0" class="head" text-anchor="middle">“ rises”</text>
<text x="428.0" y="412.0" class="head" text-anchor="middle">“ in”</text>
<text x="544.0" y="412.0" class="head" text-anchor="middle">“ the”</text>
<text x="670.0" y="130.0" class="bigtext">→ “sky”</text>
<g class="s0">
<circle class="fhatch" cx="134.0" cy="350.0" r="6"/>
<circle class="thin" cx="134.0" cy="350.0" r="6"/>
<text x="144.0" y="354.0" class="small">L0/N513+</text>
