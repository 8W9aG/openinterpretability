<text x="20.0" y="30.0" class="title">What the registry already knows about each unit</text>
<text x="20.0" y="50.0" class="sub">Large dot: the unit has a tested (VERIFIED) explanation. Small dot: it has none yet. The bar: the share of</text>
<text x="20.0" y="68.0" class="sub">all the attribution that explained units hold.</text>
