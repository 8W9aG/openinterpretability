<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" role="img">
<title>Two prompts: “The sun rises in the” and “The price rises in the”. Copying the route&#x27;s values from the second into the first makes “sky” fall 86% as far as the second prompt does. Random sets of the same shape, copied the same way, move it 8.3% on average.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.hatchline{stroke:var(--ink2);stroke-width:1.4}.fhatch{fill:url(#hatch)}.dashed{stroke-dasharray:4 3}.outline{fill:var(--surface);stroke:var(--ink2);stroke-width:1.4}.edge{fill:none;stroke:var(--ink2);stroke-opacity:.55}.cell{stroke:var(--surface)}.oncell{fill:#ffffff;font-size:11px}.mark{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--ink2);stroke-width:1.2}.rule{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}.arrow{fill:none;stroke:var(--ink2);stroke-width:1.6;marker-end:url(#tip)}.tipfill{fill:var(--ink2)}.box{fill:var(--surface);stroke:var(--ink2);stroke-width:1.3}.bigtext{fill:var(--ink);font-size:15px;font-weight:600}@keyframes slide{0%,8%{transform:translateX(-440.1px)}40%{transform:translateX(0px)}100%{transform:translateX(0px)}}.slide{animation:slide 10s ease-in-out infinite;transform:translateX(0px)}</style>
<rect class="bg" width="760" height="394" rx="10"/>
<text x="20.0" y="30.0" class="title">Swap the subject, and move only the route</text>
<text x="20.0" y="50.0" class="sub">The route&#x27;s values are copied from the second prompt into the first. How far does “sky” fall, as a share</text>
<text x="20.0" y="68.0" class="sub">of how far it falls on the second prompt?</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><path d="M0 0V5" class="hatchline"/></pattern></defs>
<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tipfill" d="M0 0L8 4L0 8Z"/></marker></defs>
<text x="20.0" y="114.0" class="small">clean prompt</text>
<text x="130.0" y="114.0" class="head">The SUN rises in the</text>
<text x="20.0" y="136.0" class="small">corrupted</text>
<text x="130.0" y="136.0" class="head">The PRICE rises in the</text>
<path class="grid" d="M180.9 180.0L180.9 250.0"/>
<text x="180.9" y="265.0" class="small" text-anchor="middle">0.0</text>
<path class="grid" d="M231.8 180.0L231.8 250.0"/>
<text x="231.8" y="265.0" class="small" text-anchor="middle">0.1</text>
<path class="grid" d="M435.5 180.0L435.5 250.0"/>
<text x="435.5" y="265.0" class="small" text-anchor="middle">0.5</text>
<path class="grid" d="M690.0 180.0L690.0 250.0"/>
<text x="690.0" y="265.0" class="small" text-anchor="middle">1.0</text>
<text x="410.0" y="281.0" class="small" text-anchor="middle">share of the fall in “sky” that the second prompt causes</text>
<text x="120.0" y="204.0" class="small" text-anchor="end">the route</text>
<g class="slide">
<circle class="fc1" cx="621.0" cy="200.0" r="7"/>
</g>
<g class="routepct">
<text x="621.0" y="188.0" class="head" text-anchor="middle">86.5%</text>
</g>
<g class="nulls">
<text x="120.0" y="236.0" class="small" text-anchor="end">8 random sets</text>
<circle class="open sneutral" cx="238.3" cy="232.0" r="4"/>
<circle class="open sneutral" cx="150.9" cy="232.0" r="4"/>
<circle class="open sneutral" cx="282.5" cy="232.0" r="4"/>
<circle class="open sneutral" cx="244.0" cy="232.0" r="4"/>
<circle class="open sneutral" cx="136.9" cy="232.0" r="4"/>
<circle class="open sneutral" cx="207.5" cy="232.0" r="4"/>
<circle class="open sneutral" cx="320.3" cy="232.0" r="4"/>
<circle class="open sneutral" cx="205.3" cy="232.0" r="4"/>
<path class="mark" d="M223.2 223.0L223.2 241.0"/>
</g>
<g class="l0">
<path class="mark" d="M25.0 314.0l3.5 4 7-9"/>
<text x="44.0" y="318.0" class="head">The route moves the answer 86% of the way</text>
<text x="736.0" y="318.0" class="small" text-anchor="end">rule ≥ 50%</text>
</g>
<g class="l1">
<path class="mark" d="M25.0 336.0l3.5 4 7-9"/>
<text x="44.0" y="340.0" class="head">Random sets move it 8.3% on average</text>
<text x="736.0" y="340.0" class="small" text-anchor="end">rule ≤ 10%</text>
</g>
</svg>
