<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img">
<title>Bar chart of the five most likely next tokens. “days” has 73%. The right answer, “months”, has 3%.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.hatchline{stroke:var(--ink2);stroke-width:1.4}.fhatch{fill:url(#hatch)}.dashed{stroke-dasharray:4 3}.outline{fill:var(--surface);stroke:var(--ink2);stroke-width:1.4}.edge{fill:none;stroke:var(--ink2);stroke-opacity:.55}.cell{stroke:var(--surface)}.oncell{fill:#ffffff;font-size:11px}.mark{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--ink2);stroke-width:1.2}.rule{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}.arrow{fill:none;stroke:var(--ink2);stroke-width:1.6;marker-end:url(#tip)}.tipfill{fill:var(--ink2)}.box{fill:var(--surface);stroke:var(--ink2);stroke-width:1.3}.bigtext{fill:var(--ink);font-size:15px;font-weight:600}</style>
<rect class="bg" width="760" height="272" rx="10"/>
<text x="20.0" y="30.0" class="title">The mistake: the model is sure, and wrong</text>
<text x="20.0" y="50.0" class="sub">pythia-70m&#x27;s most likely next tokens after “A week has seven days and a year has twelve”.</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><path d="M0 0V5" class="hatchline"/></pattern></defs>
<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tipfill" d="M0 0L8 4L0 8Z"/></marker></defs>
<path class="grid" d="M150.0 90.0L150.0 220.0"/>
<text x="150.0" y="235.0" class="small" text-anchor="middle">0.00</text>
<path class="grid" d="M275.0 90.0L275.0 220.0"/>
<text x="275.0" y="235.0" class="small" text-anchor="middle">0.25</text>
<path class="grid" d="M400.0 90.0L400.0 220.0"/>
<text x="400.0" y="235.0" class="small" text-anchor="middle">0.50</text>
<path class="grid" d="M525.0 90.0L525.0 220.0"/>
<text x="525.0" y="235.0" class="small" text-anchor="middle">0.75</text>
<path class="grid" d="M650.0 90.0L650.0 220.0"/>
<text x="650.0" y="235.0" class="small" text-anchor="middle">1.00</text>
<text x="400.0" y="251.0" class="small" text-anchor="middle">probability</text>
<rect class="fc1" x="150.0" y="94.0" width="362.9" height="18.0" rx="1.5"/>
<text x="140.0" y="107.0" class="head" text-anchor="end">“ days”</text>
<text x="520.9" y="107.0" class="small">72.6%</text>
<rect class="fc1" x="150.0" y="120.0" width="39.8" height="18.0" rx="1.5"/>
<text x="140.0" y="133.0" text-anchor="end">“ weeks”</text>
<text x="197.8" y="133.0" class="small">8.0%</text>
<rect class="fc1" x="150.0" y="146.0" width="15.7" height="18.0" rx="1.5"/>
<text x="140.0" y="159.0" text-anchor="end">“ hours”</text>
<text x="173.7" y="159.0" class="small">3.1%</text>
<rect class="fhatch" x="150.0" y="172.0" width="14.8" height="18.0" rx="1.5"/>
<rect class="thin" x="150.0" y="172.0" width="14.8" height="18.0" rx="1.5"/>
<text x="140.0" y="185.0" text-anchor="end">“ months”</text>
<text x="172.8" y="185.0" class="head">2.9%  ← the right answer</text>
<rect class="fc1" x="150.0" y="198.0" width="5.5" height="18.0" rx="1.5"/>
<text x="140.0" y="211.0" text-anchor="end">“ to”</text>
<text x="163.5" y="211.0" class="small">1.1%</text>
</svg>
