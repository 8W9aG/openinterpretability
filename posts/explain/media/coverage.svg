<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" role="img">
<title>Four rows on one scale. The model as it is gives “sky” a log-probability of -2.80. With every unit at its baseline it falls to -10.25. With only the 86 explained units kept it comes back to -4.15, which is 81.9% of the way. Random sets of the same shape bring back 13.0% on average.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.hatchline{stroke:var(--ink2);stroke-width:1.4}.fhatch{fill:url(#hatch)}.dashed{stroke-dasharray:4 3}.outline{fill:var(--surface);stroke:var(--ink2);stroke-width:1.4}.edge{fill:none;stroke:var(--ink2);stroke-opacity:.55}.cell{stroke:var(--surface)}.oncell{fill:#ffffff;font-size:11px}.mark{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--ink2);stroke-width:1.2}.rule{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}.arrow{fill:none;stroke:var(--ink2);stroke-width:1.6;marker-end:url(#tip)}.tipfill{fill:var(--ink2)}.box{fill:var(--surface);stroke:var(--ink2);stroke-width:1.3}.bigtext{fill:var(--ink);font-size:15px;font-weight:600}@keyframes travel{0.0%{transform:translate(694.8px,128.0px)}12.0%{transform:translate(694.8px,128.0px)}35.0%{transform:translate(275.2px,168.0px)}50.0%{transform:translate(275.2px,168.0px)}75.0%{transform:translate(618.8px,208.0px)}100%{transform:translate(618.8px,208.0px)}}.travel{animation:travel 10s ease-in-out infinite;transform:translate(618.8px,208.0px)}</style>
<rect class="bg" width="760" height="428" rx="10"/>
<text x="20.0" y="30.0" class="title">Switch everything else off: how much of “sky” comes back?</text>
<text x="20.0" y="50.0" class="sub">How likely the model is to say “sky” (log-probability). Every unit not kept is set to its baseline. The</text>
<text x="20.0" y="68.0" class="sub">ring follows the answer from one run to the next.</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><path d="M0 0V5" class="hatchline"/></pattern></defs>
<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tipfill" d="M0 0L8 4L0 8Z"/></marker></defs>
<path class="grid" d="M289.1 108.0L289.1 268.0"/>
<text x="289.1" y="283.0" class="small" text-anchor="middle">−10</text>
<path class="grid" d="M458.2 108.0L458.2 268.0"/>
<text x="458.2" y="283.0" class="small" text-anchor="middle">−7</text>
<path class="grid" d="M683.7 108.0L683.7 268.0"/>
<text x="683.7" y="283.0" class="small" text-anchor="middle">−3</text>
<text x="485.0" y="299.0" class="small" text-anchor="middle">log-probability of “sky” (higher is more likely)</text>
<g class="clean">
<text x="238.0" y="132.0" class="head" text-anchor="end">the model as it is</text>
<circle class="fc1" cx="694.8" cy="128.0" r="7"/>
</g>
<g class="off">
<text x="238.0" y="172.0" class="small" text-anchor="end">every unit at its baseline</text>
<circle class="fc1" cx="275.2" cy="168.0" r="7"/>
</g>
<g class="kept">
<text x="238.0" y="212.0" class="small" text-anchor="end">only the 86 explained units kept</text>
<circle class="fc1" cx="618.8" cy="208.0" r="7"/>
<path class="arrow" d="M275.2 208.0L609.8 208.0"/>
</g>
<g class="rand">
<text x="238.0" y="252.0" class="small" text-anchor="end">random sets of the same shape</text>
<circle class="open sneutral" cx="336.6" cy="248.0" r="5"/>
<circle class="open sneutral" cx="385.6" cy="248.0" r="5"/>
<circle class="open sneutral" cx="308.0" cy="248.0" r="5"/>
<circle class="open sneutral" cx="288.9" cy="248.0" r="5"/>
</g>
<circle class="mark travel" cx="0" cy="0" r="9"/>
<g class="share">
<path class="thin" d="M275.2 330.0L694.8 330.0"/>
<path class="thin" d="M275.2 325.0L275.2 335.0"/>
<path class="thin" d="M694.8 325.0L694.8 335.0"/>
<path class="mark" d="M275.2 340.0L618.8 340.0"/>
<text x="265.2" y="334.0" class="small" text-anchor="end">all the units do for “sky”</text>
<text x="265.2" y="348.0" class="bigtext" text-anchor="end">81.9% comes back</text>
</g>
<g class="randshare">
<text x="20.0" y="376.0" class="head">Random sets with the same number of heads and neuron poles in each layer bring back 13.0% on average.</text>
</g>
</svg>
