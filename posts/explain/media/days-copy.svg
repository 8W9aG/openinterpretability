<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" role="img">
<title>The prompt&#x27;s ten tokens. Count-word neurons fire on “seven” and “twelve”; time-unit neurons fire on “week”, “days” and “year”. A ring starts at “twelve”, jumps back to the earlier count word “seven”, steps to the word after it, “days”, and carries “days” to the end, where the model says it.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.hatchline{stroke:var(--ink2);stroke-width:1.4}.fhatch{fill:url(#hatch)}.dashed{stroke-dasharray:4 3}.outline{fill:var(--surface);stroke:var(--ink2);stroke-width:1.4}.edge{fill:none;stroke:var(--ink2);stroke-opacity:.55}.cell{stroke:var(--surface)}.oncell{fill:#ffffff;font-size:11px}.mark{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:var(--ink2);stroke-width:1.2}.rule{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}.arrow{fill:none;stroke:var(--ink2);stroke-width:1.6;marker-end:url(#tip)}.tipfill{fill:var(--ink2)}.box{fill:var(--surface);stroke:var(--ink2);stroke-width:1.3}.bigtext{fill:var(--ink);font-size:15px;font-weight:600}@keyframes copy{0.0%{transform:translate(629.0px,142.0px)}10.0%{transform:translate(629.0px,142.0px)}32.0%{transform:translate(257.0px,142.0px)}42.0%{transform:translate(257.0px,142.0px)}52.0%{transform:translate(319.0px,142.0px)}60.0%{transform:translate(319.0px,142.0px)}80.0%{transform:translate(663.0px,142.0px)}100%{transform:translate(663.0px,142.0px)}}.copy{animation:copy 10s ease-in-out infinite;transform:translate(663.0px,142.0px)}</style>
<rect class="bg" width="760" height="378" rx="10"/>
<text x="20.0" y="30.0" class="title">How it goes wrong: the model copies the pattern</text>
<text x="20.0" y="50.0" class="sub">Bars: how strongly the claim&#x27;s layer-0 neurons fire at each token (measured). The ring: the copy step, as</text>
<text x="20.0" y="68.0" class="sub">the claim states it.</text>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><path d="M0 0V5" class="hatchline"/></pattern></defs>
<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tipfill" d="M0 0L8 4L0 8Z"/></marker></defs>
<text x="20.0" y="120.0" class="small">copy heads L3/H3, L4/H0 and L4/H7, as the claim states it</text>
<path class="grid" d="M51.0 142.0L649.0 142.0"/>
<text x="20.0" y="194.0" class="small">count-word neurons</text>
<path class="axis" d="M51.0 244.0L649.0 244.0"/>
<rect class="fc1" x="246.0" y="207.2" width="22.0" height="36.8" rx="1.5"/>
<rect class="fc1" x="618.0" y="198.0" width="22.0" height="46.0" rx="1.5"/>
<text x="20.0" y="258.0" class="small">time-unit neurons</text>
<path class="axis" d="M51.0 308.0L649.0 308.0"/>
<rect class="fhatch" x="122.0" y="285.1" width="22.0" height="22.9" rx="1.5"/>
<rect class="thin" x="122.0" y="285.1" width="22.0" height="22.9" rx="1.5"/>
<rect class="fhatch" x="308.0" y="273.2" width="22.0" height="34.8" rx="1.5"/>
<rect class="thin" x="308.0" y="273.2" width="22.0" height="34.8" rx="1.5"/>
<rect class="fhatch" x="494.0" y="285.4" width="22.0" height="22.6" rx="1.5"/>
<rect class="thin" x="494.0" y="285.4" width="22.0" height="22.6" rx="1.5"/>
<text x="71.0" y="326.0" class="head" text-anchor="middle">“A”</text>
<text x="133.0" y="326.0" class="head" text-anchor="middle">“ week”</text>
<text x="195.0" y="326.0" class="head" text-anchor="middle">“ has”</text>
<text x="257.0" y="326.0" class="head" text-anchor="middle">“ seven”</text>
<text x="319.0" y="326.0" class="head" text-anchor="middle">“ days”</text>
<text x="381.0" y="326.0" class="head" text-anchor="middle">“ and”</text>
<text x="443.0" y="326.0" class="head" text-anchor="middle">“ a”</text>
<text x="505.0" y="326.0" class="head" text-anchor="middle">“ year”</text>
<text x="567.0" y="326.0" class="head" text-anchor="middle">“ has”</text>
<text x="629.0" y="326.0" class="head" text-anchor="middle">“ twelve”</text>
<text x="675.0" y="147.0" class="bigtext">→ “days”</text>
<path class="arrow" d="M629.0 138.0Q446.0 104.0 263.0 138.0"/>
<text x="443.0" y="110.0" class="small" text-anchor="middle">look back for the last count word</text>
<circle class="mark copy" cx="0" cy="0" r="9"/>
</svg>
