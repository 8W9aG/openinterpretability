# The post's X thread (openinterpretability/social/thread.py, #5833). Each blurb gives
# numbers from the post only. {link} is the post's URL. The post has no figures yet.
- section: Two prompts
  text: >-
    Why did the model say that? We follow two explanations of Pythia-70m to the end: "The sun
    rises in the" → " sky", and a wrong answer, " days" for " months". {link}
- section: Attribution is a first guess
  text: >-
    Attribution is a first guess. Units with VERIFIED explanations hold 6.4% of the
    attribution for " days", and 10.1% for " sky". Pushes up and down cancel, so a share of
    the total says little.
- section: Causal coverage is the target
  text: >-
    Coverage asks a direct question: keep the explained units, set every other unit to its
    mean, and see how much of the answer comes back. For " days" it is 93.8%, and for " sky"
    81.9%.
- section: The random baseline
  text: >-
    Random sets of the same kinds bring back 10.1% for " days" and 13.0% for " sky". Even so,
    coverage shows only that the units are sufficient on the prompt, not how they make the
    answer.
- section: 'The wrong answer: " days" for " months"'
  text: >-
    The wrong answer is a copy. At " twelve", head L3/H3 attends to " days", the noun after
    the earlier count word, and copies it to the last position. The VERIFIED claim's route
    has 32 units.
- section: 'The wrong answer: " days" for " months"'
  text: >-
    The first claim failed one gate: random sets patched from its corrupted prompt moved the
    answer by 0.16 on the mean, over the 0.1 allowed. The second changed the count word
    instead, and passed every gate.
- section: What this shows, and what it doesn't
  text: >-
    It shows a mechanism for one wrong answer on one prompt. It doesn't show that Pythia-70m
    always copies this way. The post: {link}
