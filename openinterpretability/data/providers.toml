# Model providers that can drive an experiment loop (issue #3245, docs/providers.md).
#
# A profile never holds an API key. `key_env` names the environment variable that holds
# it, and `key_keychain` names a macOS keychain entry (service name) to read when the
# variable is unset. `open-interpretability provider exec` puts the key in the child's
# environment only.
#
# Fields:
#   base_url        ANTHROPIC_BASE_URL for Claude Code; empty for Anthropic itself.
#   model           the model Claude Code drives with (`--model`).
#   small_model     the model for Claude Code's subagents and quick calls (default: model).
#   key_env         the environment variable that holds the key.
#   key_keychain    a macOS keychain service to read the key from, when key_env is unset.
#   key_required    false when Claude Code can use its own login (Anthropic).
#   litellm_model   the model string `open-interpretability loop` passes to LiteLLM.
#   proxy_config    a LiteLLM proxy config, for providers with no Anthropic-compatible API.
#   proxy_port      the port the proxy listens on, on 127.0.0.1.
#   reported_model  what to record as the driver, when Claude Code sees another name.
#   env             extra environment variables for Claude Code.

[anthropic]
model = "claude-haiku-5-5"
key_env = "ANTHROPIC_API_KEY"
key_required = false
litellm_model = "anthropic/claude-opus-5-5"

[deepseek]
base_url = "https://api.deepseek.com/anthropic"
model = "deepseek-flash[1m]"
small_model = "deepseek-flash"
key_env = "DEEPSEEK_API_KEY"
key_keychain = "openinterpretability-deepseek"
litellm_model = "deepseek/deepseek-flash"
# A 422 on `tool_definition` without the first; DeepSeek's context limit is 1M tokens.
env = { ENABLE_TOOL_SEARCH = "false", ENABLE_CLAUDEAI_MCP_SERVERS = "false", CLAUDE_CODE_AUTO_COMPACT_WINDOW = "800000" }

[zai]
base_url = "https://api.z.ai/api/anthropic"
model = "glm-5.3-flash[1m]"
key_env = "ZAI_API_KEY"
key_keychain = "openinterpretability-zai"
env = { CLAUDE_CODE_AUTO_COMPACT_WINDOW = "800000", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" }

[muse]
base_url = "https://api.meta.ai"
model = "muse-spark-1.3-contributor"
key_env = "MUSE_API_KEY"
key_keychain = "openinterpretability-muse"
env = { ENABLE_TOOL_SEARCH = "false" }

[gemini]
base_url = "http://127.0.0.1:4000"
model = "gemini/gemini-3.8-flash"
key_env = "GEMINI_API_KEY"
key_keychain = "openinterpretability-gemini"
litellm_model = "gemini/gemini-3.8-flash"
proxy_config = "~/.litellm-gemini.yaml"
proxy_port = 4000

[grok]
base_url = "http://127.0.0.1:4001"
# The proxy maps this Anthropic model name to Grok, so Claude Code accepts it.
model = "claude-3-5-sonnet-20241022"
reported_model = "xai/grok (via ~/.litellm-grok.yaml)"
key_env = "XAI_API_KEY"
key_keychain = "openinterpretability-xai"
proxy_config = "~/.litellm-grok.yaml"
proxy_port = 4001
