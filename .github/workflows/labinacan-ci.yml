name: Checks

# The generic checks of an autoresearch project's pull requests and of main (#6630): code
# changes, lint and tests, mutation testing and accessibility. The project's own jobs are in
# ci.yml. These jobs keep their names, because branch protection requires "Lint and tests"
# by name. A reusable workflow would rename each check to "caller / job".
# This file holds no value of a project (tests/test_labinacan_config.py checks that). The
# project gives its values through make (`make packages`, `make project-lint`,
# `make sample-run`) and scripts/ci-install.sh.

on:
  # A draft starts no work: every job below is skipped while the pull request is a draft,
  # and ready_for_review starts the full run (#4690).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The draft flag keeps a draft-time run from cancelling the ready run (#6179).
concurrency:
  group: checks-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  code-changes:
    name: Code changes
    # Whether a pull request changes any file outside wiki/, by the same rule as
    # auto-merge.yml. A wiki-only PR (an experiment) runs the same code as main, so
    # "Lint and tests" is skipped for it.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        # --no-renames lists a rename as a delete and an add, so moving a file into wiki/
        # still counts as a change outside it. A PR with no changed files counts as code.
        run: |
          git diff --name-only --no-renames "origin/$BASE_REF...HEAD" | tee files.txt
          if [ -s files.txt ] && ! grep -qv '^wiki/' files.txt; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Lint and tests
    # Runs on pushes to main (code-changes is skipped there, so its output is empty), on
    # PRs that change code, and if code-changes fails. Skipped only when code-changes
    # says "false". A skipped job counts as passing, so it can still be a required check;
    # paths-ignore on the workflow would leave the check pending and block the merge.
    needs: code-changes
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.code-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # The suite takes a few minutes. A hung step fails here, not at GitHub's 6-hour limit.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read  # the PR's closing issues, for the paper status step (#5395)
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the IFTTT lint diffs against the PR's base branch
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (scripts/ci-install.sh, the project's)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Copies kept in sync (IFTTT lint)
        if: github.event_name == 'pull_request'
        run: python scripts/ifttt_lint.py --base "origin/${{ github.base_ref }}"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_line_limit.py
          python scripts/check_step_comments.py
          python scripts/check_body_comments.py
          python scripts/check_docstring_args.py
          python scripts/check_docstring_sections.py
          python scripts/exchange.py check
          python scripts/changelog.py check
          interrogate $(make -s packages) scripts
          python scripts/check_markdown.py
      - name: The project's own checks (make project-lint)
        env:
          UV_NO_SYNC: "1"  # keep the packages that ci-install.sh put in .venv
        run: make project-lint
      - name: Paper status lines name no issue this PR closes (#5395)
        # A preprint's status line lists open issues as work left. A PR that closes one of
        # them must update the line, or publish the paper, in the same PR.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          closing=$(gh pr view "$PR" --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | join(",")')
          python scripts/papers.py check --closing "$closing"
      - name: Types (mypy, strict, on [tool.mypy] files)
        run: mypy
      - name: Shell scripts (ShellCheck)
        run: make shell SHELLCHECK=shellcheck
      - name: Install Vale
        # A release binary, pinned and checked: Vale is a Go program, not a Python package.
        env:
          VALE_VERSION: 3.26.0
          VALE_SHA256: 22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed
        run: |
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/$tarball"
          echo "$VALE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Comment and docstring prose (Vale)
        run: make vale
      - name: Markdown prose (STE linter)
        run: make ste
      - name: Tests, with branch coverage
        # Side by side, one process per core (#3266). It fails if the total is below
        # fail_under in .coveragerc (#3166). The packages come from `make -s packages`.
        # --durations shows the slowest tests, so a creep toward the timeout shows early.
        run: |
          pytest -n auto $(make -s packages | sed 's/[^ ]*/--cov=&/g') \
            --cov-report=xml --cov-report=term --durations=15
      - name: Why a test worker died
        # A crashed xdist worker loses its stderr. Each worker's faulthandler dump goes to
        # logs/faulthandler-<worker>.log (tests/conftest.py), and the kernel log names an
        # out-of-memory kill (#6561).
        if: failure()
        run: |
          # Each worker's file starts with a "== worker" line; a dump follows only a crash.
          for log in logs/faulthandler-*.log; do
            [ -f "$log" ] && { echo "=== $log"; cat "$log"; }
          done
          sudo dmesg | grep -i -E "out of memory|oom-kill|killed process" \
            || echo "No out-of-memory kill in the kernel log."
      - name: Coverage of the changed lines (diff-cover)
        # fail_under in .diff-cover.toml of the lines that the pull request changes must be
        # tested (#3166, #5855).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: diff-cover coverage.xml -c .diff-cover.toml --compare-branch="origin/$BASE_REF"

  mutation:
    name: Mutation testing
    # Mutation testing of the package files that a PR changes (scripts/mutation.py, #5857).
    # The maintainer runs `make mutation BASE=origin/main` before opening a PR (#5856), so
    # the maintainer's PRs skip it. The repository's owner is the maintainer's login, and
    # agents that run under it open PRs as the maintainer too. Wiki-only PRs skip it, as
    # "Lint and tests" does.
    needs: code-changes
    if: >-
      ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft
      && needs.code-changes.outputs.code == 'true'
      && github.event.pull_request.user.login != github.repository_owner }}
    runs-on: ubuntu-latest
    # Measured on the package files of #6459 (#5857); a hung run fails here.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the script diffs against the PR's base branch
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (scripts/ci-install.sh, the project's)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Mutate the changed package files
        env:
          BASE_REF: ${{ github.base_ref }}
        # A surviving mutant, or one that no test reaches, fails the step (scripts/mutation.py).
        run: |
          set -o pipefail
          make mutation BASE="origin/$BASE_REF" 2>&1 | tee mutation.log
      - name: Surviving mutants in the job summary
        if: ${{ !cancelled() }}
        run: |
          [ -f mutation.log ] || exit 0  # the run failed before it started
          {
            echo "### Mutation testing"
            echo
            if grep -qE ': (survived|no tests|timeout|suspicious)$' mutation.log; then
              echo "These mutants survived. Each one's diff:"
              show="uv run python scripts/mutation.py --base origin/main"
              echo "\`$show show <name>\`"
              echo
              grep -E ': (survived|no tests|timeout|suspicious)$' mutation.log | sed 's/^/- /'
            else
              tail -n 1 mutation.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mutation-ran:
    name: Mutation testing ran locally
    # The maintainer's PRs skip the mutation job above, so the maintainer and the agents run
    # it before they push (work-an-issue, step 6). A PR from the owner that changes package
    # code must say so in its body: "**Mutation testing:** No mutant survived" (#5857).
    needs: code-changes
    if: >-
      ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft
      && needs.code-changes.outputs.code == 'true'
      && github.event.pull_request.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: The body records a local run with no survivor
        env:
          BASE_REF: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}  # read here, never in the script text
        run: |
          specs=()
          for package in $(make -s packages); do specs+=("$package/*.py"); done
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- "${specs[@]}")
          if [ -z "$changed" ]; then
            echo "No package file changes: no local run needed."
            exit 0
          fi
          if printf '%s' "$BODY" | grep -qF '**Mutation testing:** No mutant survived'; then
            echo "The body records a local mutation run with no survivor."
            exit 0
          fi
          echo "::error::This PR changes package code. Run 'make mutation BASE=origin/main'"
          echo "::error::until no mutant survives, then add to the body:"
          echo "::error::**Mutation testing:** No mutant survived (<n> files)."
          exit 1

  accessibility:
    name: Accessibility (axe-core)
    # axe-core over five pages of the sample site, in light and dark (scripts/a11y_check.py,
    # issue #3280). It fails on a serious or critical violation. Skipped like "Lint and
    # tests" for a wiki-only PR, which builds the same templates as main.
    needs: code-changes
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.code-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: 1.65.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (scripts/ci-install.sh, the project's)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build the sample site
        env:
          UV_NO_SYNC: "1"  # keep the CPU-only torch that ci-install.sh put in .venv
        run: make sample-run
      - name: Install Playwright and Chromium
        run: |
          uv pip install --python .venv/bin/python "playwright==$PLAYWRIGHT_VERSION"
          playwright install --with-deps chromium
      - name: Check accessibility
        run: python scripts/a11y_check.py --site dist
