name: Linear released

# When a release is published, move every closed issue in its milestone (the release's
# tag, e.g. v0.0.20) to Linear's Released state (scripts/issue_state.py --release).
# Linear's GitHub integration had set them to Done when they closed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, which is also its milestone (e.g. v0.0.20)
        required: true
      dry_run:
        description: Print the changes and make none
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

jobs:
  released:
    name: Move the release's issues to Released
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Move
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 scripts/issue_state.py --release "$TAG" $DRY_RUN
