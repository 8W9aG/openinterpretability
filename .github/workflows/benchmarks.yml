name: Benchmarks

# The memory and performance benchmarks (scripts/memory_benchmark.py, scripts/perf_bench.py,
# issue #3808). They run here, not on a laptop, so that no local run needs a quiet machine.
#
# Each run is checked against the median of the recent runs on the same runner, then added
# to docs/analyses/benchmark-ledger.jsonl (scripts/benchmark_ledger.py, issue #4011). The
# job commits the row on a branch, opens a pull request and turns on auto-merge. A PR made
# with the workflow token starts no CI, so the job also starts ci.yml on that branch. That
# run posts the required checks on the PR's head commit, and auto-merge merges it.
#
# Nightly, and before each release (the release skill starts it and waits for it). Never
# on a push or a PR.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write  # the ledger branch
  pull-requests: write  # the ledger PR, when LEDGER_TOKEN is unset

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Memory and performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # read-only, for the models and evidence blobs
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # Streaming and batch sizes follow free memory. A fixed budget keeps the work the
      # same from run to run, so that only a code change moves a peak.
      OPENINTERPRETABILITY_MEMORY_GB: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore model weights
        # The cache that main's model-cache job saves (ci.yml).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-v2-
          restore-keys: hf-hub-v2-
      - name: Evidence of merged records
        run: open-interpretability evidence load-all
      - name: Restore the scan corpus
        id: corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: corpus.jsonl
          # One corpus: pile-10k at its pinned revision, checked by SHA-256 below. Name a new
          # cache here if that ever changes.
          key: scan-corpus-pile-10k-v1
      - name: Build the scan corpus
        # The registry's corpus, rebuilt byte for byte (docs/experiments.md, "The scan corpus").
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          open-interpretability corpus --dataset pile-10k --first --ascii \
            --revision 127bfedcd5047750df5ccf3a12979a47bfa0bafa --out corpus.jsonl
      - name: Check the scan corpus
        env:
          SHA: ded48cfc4898c00bd663c4e26dd02baddc48f54f53469988097030686dd2a2ad
        run: echo "$SHA  corpus.jsonl" | sha256sum --check
      - name: Memory benchmark
        run: python scripts/memory_benchmark.py --json-out memory.json | tee memory.txt
        shell: bash
      - name: Performance benchmark
        run: python scripts/perf_bench.py --json-out perf.json | tee perf.txt
        shell: bash
      - name: Compare with the ledger
        id: check
        continue-on-error: true  # the row goes into the ledger either way; the job fails last
        run: |
          python scripts/benchmark_ledger.py check --memory memory.json --perf perf.json \
            | tee check.txt
        shell: bash
      - name: Summary
        if: always()
        run: |
          {
            echo "### Benchmarks"
            echo
            echo '```'
            cat memory.txt perf.txt check.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Add the run to the ledger through an auto-merged PR
        env:
          # A PR that github.token opens starts no CI without approval, so its required
          # checks never pass (#4215). LEDGER_TOKEN, a fine-grained token for this
          # repository with Contents, Pull requests and Actions write, opens it as a person
          # would, so CI runs. Without the secret, the step falls back to github.token.
          GH_TOKEN: ${{ secrets.LEDGER_TOKEN || github.token }}
          RUN: ${{ github.run_id }}
        run: |
          branch="benchmarks/$(date -u +%Y%m%d)-$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          python scripts/benchmark_ledger.py append --memory memory.json --perf perf.json \
            --commit "$GITHUB_SHA" --run "$RUN"
          git add docs/analyses/benchmark-ledger.jsonl
          git commit -m "Benchmark ledger: run $RUN"
          git push origin "$branch"
          body="One row from the Benchmarks workflow, run $RUN, on $GITHUB_SHA (issue #4011)."
          gh pr create --base main --head "$branch" --title "Benchmark ledger: run $RUN" \
            --body "$body It merges by itself once CI passes."
          # Opened with LEDGER_TOKEN, the PR is the maintainer's, so auto-merge.yml turns on
          # its auto-merge and its own CI runs. A fine-grained token can't enable auto-merge
          # itself, so the step no longer tries (#4215).
      - name: Fail on a regression
        if: steps.check.outcome == 'failure'
        run: |
          echo "A measure grew past its tolerance: see check.txt in the summary."
          exit 1
