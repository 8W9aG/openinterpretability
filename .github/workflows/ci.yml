name: CI

# This project's own jobs: the experiment records, their reproduction and the model cache.
# The generic checks, such as "Lint and tests", are in labinacan-ci.yml (#6630).

on:
  # A draft starts no work: every job below is skipped while the pull request is a draft,
  # and ready_for_review starts the full run (#4690).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The draft flag keeps a draft-time run from cancelling the ready run (#6179).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

env:
  # Space-separated; add a model before records use it. Kept in sync with
  # [tool.openinterpretability] models in pyproject.toml, but not read from it: a fork PR could
  # then make CI download any model.
  # LINT.IfChange
  ALLOWED_MODELS: Qwen/Qwen2.5-0.5B Qwen/Qwen2.5-1.5B openai-community/gpt2 EleutherAI/pythia-70m
  # LINT.ThenChange(pyproject.toml)

jobs:
  experiments:
    name: Experiment records
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the write-once check diffs against the PR's base branch
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Repository size against its budget (warns only)
        run: python3 scripts/repo_size.py
      - name: Evidence of records that merged before the deploy published it
        # The deploy on main publishes a merged record's blobs (`evidence publish`). Until
        # then, its evidence branch holds them, so a check that reads that record works.
        run: open-interpretability evidence load-all
      - name: Evidence of slim records
        # A slim record's blobs ride on evidence/<branch>, never on the PR branch, so that
        # main's history never holds them (evidence_branch.py, issue #3254). This
        # job only loads and checks them, with no write token: code from the PR runs here.
        # The deploy on main uploads them after the merge (`evidence publish`).
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git fetch --quiet origin "refs/heads/evidence/$HEAD_REF" 2>/dev/null; then
            open-interpretability evidence load --ref FETCH_HEAD
          fi
          open-interpretability evidence verify --base-ref "origin/$BASE_REF"
      - name: Every experiment has a valid record and wiki page
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            open-interpretability check --base-ref "origin/$BASE_REF"
          else
            open-interpretability check
          fi

  record-changes:
    name: Record changes
    # Whether a pull request adds or changes a record, by the same rule as
    # `open-interpretability reproduce --base-ref` (checks.py, changed_records), so PRs
    # without record changes never wait in the reproduce queue. A PR whose records all
    # have a valid signature skips the queue too (#4669): reproduce would skip each one.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      records: ${{ steps.diff.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The reproducible kinds come from one list (openinterpretability/core/record_kinds.py).
          mapfile -t kinds < <(python3 openinterpretability/core/record_kinds.py)
          git diff --name-only --no-renames --diff-filter=AMT "origin/$BASE_REF...HEAD" \
            -- "${kinds[@]}" | grep '\.json$' | tee records.txt || true
          if [ ! -s records.txt ]; then
            echo "records=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The gate runs from the base branch, so a PR can't change the gate that judges
          # it. It needs only the standard library, git and ssh-keygen. Any failure,
          # such as a base branch without the gate, gives "true": reproduce decides.
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          records=true
          gate_file=openinterpretability/signing.py
          if git archive "origin/$BASE_REF" "$gate_file" | tar -x -C "$base"; then
            mapfile -t changed < records.txt
            gate=$(python3 -I "$base/$gate_file" gate \
              --base-ref "origin/$BASE_REF" "${changed[@]}") || gate=true
            [ "$gate" = false ] && records=false
          fi
          echo "Reproduction needed: $records"
          echo "records=$records" >> "$GITHUB_OUTPUT"

  reproduce:
    name: Reproduce records
    # Re-runs every record a pull request adds or changes against the model it pins
    # (docs/PROTOCOL.md §5). Skipped when the PR changes no record, or when every record
    # it changes has a valid signature; a skipped job counts
    # as passing, so it can still be a required check. Fork PRs get a read-only token
    # and no secrets, and only allow-listed models are downloaded.
    needs: record-changes
    if: needs.record-changes.outputs.records == 'true'
    # One reproduction at a time across all PRs, so cost can't explode with PR volume.
    # `queue: max` keeps up to 100 pending runs in order; without it a new pending run
    # cancels the previous one. A newer push to the same PR still cancels its old run
    # through the workflow-level group above.
    concurrency:
      group: reproduce-records
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Unauthenticated Hub downloads are rate limited and can stall until the job is
      # cancelled. Fork PRs get no secrets and fall back to the model cache.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # diff against the PR's base branch to find its records
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore model weights
        # Restore only: a cache a PR saves is visible to that PR alone, so each one
        # re-downloaded the models and its ~800 MB cache evicted others. main's
        # model-cache job saves the shared one.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-v2-
          restore-keys: hf-hub-v2-
      - name: Load the evidence of slim records
        # The blobs are on evidence/<branch>, or already on the dataset (issue #3254).
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git fetch --quiet origin "refs/heads/evidence/$HEAD_REF" 2>/dev/null; then
            open-interpretability evidence load --ref FETCH_HEAD
          fi
      - name: Reproduce added or changed records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          flags=()
          for model in $ALLOWED_MODELS; do flags+=(--allow-model "$model"); done
          open-interpretability reproduce --base-ref "origin/$BASE_REF" --device cpu "${flags[@]}"

  model-cache:
    name: Model cache
    # Downloads the allow-listed models on main into the cache that pull requests'
    # reproduce jobs restore. Keyed by each model's current commit, so the cache is
    # rebuilt only when a model changes upstream.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Cache key from the models' commits
        id: key
        run: |
          auth=()
          [ -n "$HF_TOKEN" ] && auth=(-H "Authorization: Bearer $HF_TOKEN")
          api=https://huggingface.co/api/models
          for model in $ALLOWED_MODELS; do
            sha=$(curl -fsS "${auth[@]}" "$api/$model/revision/main" | jq -r .sha)
            echo "$model@$sha"
          done | tee revisions.txt
          echo "key=hf-hub-v2-$(sha256sum revisions.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore model weights
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.key.outputs.key }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Download models
        if: steps.cache.outputs.cache-hit != 'true'
        # The files transformers loads; GPT-2's repo also holds TF, Flax, ONNX and Rust
        # weights that reproduce never reads.
        run: |
          while IFS=@ read -r model sha; do
            uvx --from huggingface-hub==1.33.0 hf download "$model" --revision "$sha" \
              --include '*.json' --include '*.txt' --include '*.safetensors' --exclude 'onnx/*'
          done < revisions.txt
