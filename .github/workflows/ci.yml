name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Space-separated; add a model before records use it. Kept in sync with
  # [tool.openinterp] models in pyproject.toml, but not read from it: a fork PR could
  # then make CI download any model.
  ALLOWED_MODELS: Qwen/Qwen2.5-0.5B openai-community/gpt2

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_line_limit.py
      - name: Tests
        run: pytest

  experiments:
    name: Experiment records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the write-once check diffs against the PR's base branch
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Every experiment has a valid record and wiki page
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            openinterp check --base-ref "origin/$BASE_REF"
          else
            openinterp check
          fi

  record-changes:
    name: Record changes
    # Whether a pull request adds or changes a record, by the same rule as
    # `openinterp reproduce --base-ref` (openinterp/checks.py changed_records), so PRs
    # without record changes never wait in the reproduce queue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      records: ${{ steps.diff.outputs.records }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames --diff-filter=AM "origin/$BASE_REF...HEAD" \
            -- wiki/experiments | grep '\.json$' | tee records.txt || true
          echo "records=$([ -s records.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  reproduce:
    name: Reproduce records
    # Re-runs every record a pull request adds or changes against the model it pins
    # (docs/PROTOCOL.md §5). Skipped when the PR changes no record; a skipped job counts
    # as passing, so it can still be a required check. Fork PRs get a read-only token
    # and no secrets, and only allow-listed models are downloaded.
    needs: record-changes
    if: needs.record-changes.outputs.records == 'true'
    # One reproduction at a time across all PRs, so cost can't explode with PR volume.
    # `queue: max` keeps up to 100 pending runs in order; without it a new pending run
    # cancels the previous one. A newer push to the same PR still cancels its old run
    # through the workflow-level group above.
    concurrency:
      group: reproduce-records
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Unauthenticated Hub downloads are rate limited and can stall until the job is
      # cancelled. Fork PRs get no secrets and fall back to the model cache.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff against the PR's base branch to find its records
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore model weights
        # Restore only: a cache a PR saves is visible to that PR alone, so each one
        # re-downloaded the models and its ~800 MB cache evicted others. main's
        # model-cache job saves the shared one.
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-v2-
          restore-keys: hf-hub-v2-
      - name: Reproduce added or changed records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          flags=()
          for model in $ALLOWED_MODELS; do flags+=(--allow-model "$model"); done
          openinterp reproduce --base-ref "origin/$BASE_REF" --device cpu "${flags[@]}"

  model-cache:
    name: Model cache
    # Downloads the allow-listed models on main into the cache that pull requests'
    # reproduce jobs restore. Keyed by each model's current commit, so the cache is
    # rebuilt only when a model changes upstream.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Cache key from the models' commits
        id: key
        run: |
          auth=()
          [ -n "$HF_TOKEN" ] && auth=(-H "Authorization: Bearer $HF_TOKEN")
          for model in $ALLOWED_MODELS; do
            sha=$(curl -fsS "${auth[@]}" "https://huggingface.co/api/models/$model/revision/main" | jq -r .sha)
            echo "$model@$sha"
          done | tee revisions.txt
          echo "key=hf-hub-v2-$(sha256sum revisions.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore model weights
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.key.outputs.key }}
      - uses: astral-sh/setup-uv@v6
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Download models
        if: steps.cache.outputs.cache-hit != 'true'
        # The files transformers loads; GPT-2's repo also holds TF, Flax, ONNX and Rust
        # weights that reproduce never reads.
        run: |
          while IFS=@ read -r model sha; do
            uvx --from huggingface-hub==1.33.0 hf download "$model" --revision "$sha" \
              --include '*.json' --include '*.txt' --include '*.safetensors' --exclude 'onnx/*'
          done < revisions.txt
