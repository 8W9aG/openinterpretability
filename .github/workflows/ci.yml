name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Space-separated; add a model before records use it. Kept in sync with
  # [tool.openinterp] models in pyproject.toml, but not read from it: a fork PR could
  # then make CI download any model.
  ALLOWED_MODELS: Qwen/Qwen2.5-0.5B Qwen/Qwen2.5-1.5B openai-community/gpt2

jobs:
  code-changes:
    name: Code changes
    # Whether a pull request changes any file outside wiki/, by the same rule as
    # auto-merge.yml. A wiki-only PR (an experiment) runs the same code as main, so
    # "Lint and tests" is skipped for it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        # --no-renames lists a rename as a delete and an add, so moving a file into wiki/
        # still counts as a change outside it. A PR with no changed files counts as code.
        run: |
          git diff --name-only --no-renames "origin/$BASE_REF...HEAD" | tee files.txt
          if [ -s files.txt ] && ! grep -qv '^wiki/' files.txt; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Lint and tests
    # Runs on pushes to main (code-changes is skipped there, so its output is empty), on
    # PRs that change code, and if code-changes fails. Skipped only when code-changes
    # says "false". A skipped job counts as passing, so it can still be a required check;
    # paths-ignore on the workflow would leave the check pending and block the merge.
    needs: code-changes
    if: ${{ !cancelled() && needs.code-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # The suite takes a few minutes. A hung step fails here, not at GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_line_limit.py
          python scripts/check_data_files.py
          python scripts/changelog.py check
          interrogate openinterp
          python scripts/check_markdown.py
      - name: Shell scripts (ShellCheck)
        run: make shell SHELLCHECK=shellcheck
      - name: Install Vale
        # A release binary, pinned and checked: Vale is a Go program, not a Python package.
        env:
          VALE_VERSION: 3.26.0
          VALE_SHA256: 22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed
        run: |
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/$tarball"
          echo "$VALE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Comment and docstring prose (Vale)
        run: make vale
      - name: Markdown prose (STE linter)
        run: make ste
      - name: Tests
        run: pytest

  experiments:
    name: Experiment records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the write-once check diffs against the PR's base branch
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Repository size against its budget (warns only)
        run: python3 scripts/repo_size.py
      - name: Every experiment has a valid record and wiki page
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            openinterp check --base-ref "origin/$BASE_REF"
          else
            openinterp check
          fi

  record-changes:
    name: Record changes
    # Whether a pull request adds or changes a record, by the same rule as
    # `openinterp reproduce --base-ref` (openinterp/checks.py changed_records), so PRs
    # without record changes never wait in the reproduce queue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      records: ${{ steps.diff.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames --diff-filter=AM "origin/$BASE_REF...HEAD" \
            -- wiki/experiments | grep '\.json$' | tee records.txt || true
          echo "records=$([ -s records.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  reproduce:
    name: Reproduce records
    # Re-runs every record a pull request adds or changes against the model it pins
    # (docs/PROTOCOL.md §5). Skipped when the PR changes no record; a skipped job counts
    # as passing, so it can still be a required check. Fork PRs get a read-only token
    # and no secrets, and only allow-listed models are downloaded.
    needs: record-changes
    if: needs.record-changes.outputs.records == 'true'
    # One reproduction at a time across all PRs, so cost can't explode with PR volume.
    # `queue: max` keeps up to 100 pending runs in order; without it a new pending run
    # cancels the previous one. A newer push to the same PR still cancels its old run
    # through the workflow-level group above.
    concurrency:
      group: reproduce-records
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Unauthenticated Hub downloads are rate limited and can stall until the job is
      # cancelled. Fork PRs get no secrets and fall back to the model cache.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # diff against the PR's base branch to find its records
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore model weights
        # Restore only: a cache a PR saves is visible to that PR alone, so each one
        # re-downloaded the models and its ~800 MB cache evicted others. main's
        # model-cache job saves the shared one.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-v2-
          restore-keys: hf-hub-v2-
      - name: Reproduce added or changed records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          flags=()
          for model in $ALLOWED_MODELS; do flags+=(--allow-model "$model"); done
          openinterp reproduce --base-ref "origin/$BASE_REF" --device cpu "${flags[@]}"

  model-cache:
    name: Model cache
    # Downloads the allow-listed models on main into the cache that pull requests'
    # reproduce jobs restore. Keyed by each model's current commit, so the cache is
    # rebuilt only when a model changes upstream.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Cache key from the models' commits
        id: key
        run: |
          auth=()
          [ -n "$HF_TOKEN" ] && auth=(-H "Authorization: Bearer $HF_TOKEN")
          api=https://huggingface.co/api/models
          for model in $ALLOWED_MODELS; do
            sha=$(curl -fsS "${auth[@]}" "$api/$model/revision/main" | jq -r .sha)
            echo "$model@$sha"
          done | tee revisions.txt
          echo "key=hf-hub-v2-$(sha256sum revisions.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore model weights
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.key.outputs.key }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Download models
        if: steps.cache.outputs.cache-hit != 'true'
        # The files transformers loads; GPT-2's repo also holds TF, Flax, ONNX and Rust
        # weights that reproduce never reads.
        run: |
          while IFS=@ read -r model sha; do
            uvx --from huggingface-hub==1.33.0 hf download "$model" --revision "$sha" \
              --include '*.json' --include '*.txt' --include '*.safetensors' --exclude 'onnx/*'
          done < revisions.txt
