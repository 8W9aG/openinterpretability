name: Publish to PyPI

# Publishes `open-interpretability` to PyPI each time a GitHub release is published (issue
# #3251). The `release` skill publishes one for every version. The job builds the wheel and
# the sdist, checks that the release's tag is the package's version, and uploads them with
# the repository secret PYPI_TOKEN (docs/development.md, *Releases on PyPI*).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Check that the release's tag is the package's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' openinterp/__init__.py)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::release ${TAG} is not the package's version v${version}"
            exit 1
          fi
      - name: Build
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}
