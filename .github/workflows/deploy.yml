name: Deploy registry

# Rebuild dist/ from main and delta-sync it to Cloudflare R2 whenever main changes. The
# build is deterministic, so when no experiment changed the sync uploads, deletes and
# purges nothing.
#
# Deploying on push is what keeps the site current: GitHub runs scheduled workflows on a
# best-effort basis, and the hourly cron this used to rely on fired once in 7 hours on
# 2026-10-19. The schedule stays as a backstop (e.g. after a failed sync).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours, off the top of the hour when Actions is busiest
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # the build reads each record's PR author (openinterp/builder/users.py)

concurrency:
  group: deploy-registry
  cancel-in-progress: false  # never interrupt a sync halfway

jobs:
  deploy:
    name: Build and sync to R2
    # Skipped (not failed) until the deploy is configured; see docs/development.md "Deploy".
    if: ${{ vars.R2_BUCKET != '' }}
    runs-on: ubuntu-latest
    # A hung build or sync fails here, not at GitHub's 6-hour limit.
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          # `open-interpretability check` checks the errata file's signature at the time it landed,
          # which needs main's history (openinterp/signing.py landing_times).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check registry consistency
        run: open-interpretability check
      # The personal-data matches of each text that earlier builds searched
      # (openinterp/builder/pii.py), so this build searches only new text.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/openinterp/pii
          key: pii-spans-${{ github.run_id }}
          restore-keys: pii-spans-
      # The author of the PR that merged each record without a contributor
      # (openinterp/builder/users.py), so this build asks GitHub only for new PRs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/openinterp/pr-authors
          key: pr-authors-${{ github.run_id }}
          restore-keys: pr-authors-
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}  # reads PR authors from the API
        run: |
          open-interpretability build --wiki-dir wiki --output-dir dist
          python -m pagefind --site dist
      - name: Sync to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          # Optional: purge changed URLs from the Cloudflare cache (custom domain only).
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OPENINTERP_SITE_URL: ${{ vars.OPENINTERP_SITE_URL }}
        run: |
          open-interpretability deploy --dist-dir dist --bucket "$R2_BUCKET" --delete \
            | tee deploy.log
          {
            echo "### Registry deploy"
            echo
            tail -n 2 deploy.log
          } >> "$GITHUB_STEP_SUMMARY"
