name: Deploy registry

# Rebuild dist/ from main and delta-sync it to Cloudflare R2 whenever main changes. The
# build is deterministic, so when no experiment changed the sync uploads, deletes and
# purges nothing.
#
# A push deploys at once. A merge by the auto-merge bot uses the workflow token, which
# starts no workflow, so it gets no push run (issue #3989). The schedule catches those:
# every 30 minutes it deploys if main moved since the last successful deploy, and else
# skips. GitHub runs schedules on a best-effort basis, so a tick can be late.
#
# A published GitHub release deploys at once too (#5196). The release PR merges by the
# bot, so it gets no push run, and the schedule left the site stale for up to an hour
# after a release. The release skill publishes the release with the maintainer's token,
# so this event starts workflows, as it does publish.yml.
on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "7,37 * * * *"  # every 30 minutes, off the top of the hour when Actions is busiest
  workflow_dispatch:
    inputs:
      repost:
        description: "Entry ids to post to X although they were seen, separated by spaces (#5527)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read  # the build reads each record's PR author (builder/users.py)
  actions: read  # the schedule reads the last successful deploy

concurrency:
  group: deploy-registry
  cancel-in-progress: false  # never interrupt a sync halfway

jobs:
  changed:
    name: Main changed since the last deploy
    # A push, a release or a dispatch always deploys. A scheduled tick deploys only if main's head
    # differs from the head of the last successful deploy. A failed deploy doesn't
    # count, so the next tick tries again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Decide whether to deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$HEAD" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "main is at ${HEAD:0:8}, already deployed: skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and sync to R2
    needs: changed
    # Skipped (not failed) until the deploy is configured; see docs/development.md "Deploy".
    if: ${{ vars.R2_BUCKET != '' && needs.changed.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    outputs:  # for report-x: a failed post leaves the deploy green (#5528)
      x_outcome: ${{ steps.x.outcome }}
      x_error: ${{ steps.x_error.outputs.error }}
      x_posted: ${{ steps.posted.outcome == 'success' }}  # for x-links (#5840)
    # A hung build or sync fails here, not at GitHub's 6-hour limit.
    timeout-minutes: 60
    environment: production
    env:
      # Read-only, for the evidence blobs that `check` and the build download. Without a
      # token the downloads are anonymous and get a lower rate limit. The publish step
      # sets its own write token.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit that started this run, whose copy of this file is running. With
          # `ref: main`, a run started by an older push built newer code with older steps:
          # on 2026-11-15 it uploaded pages that link assets/site.css without building it.
          # A push, a dispatch on main and the schedule all give a commit on main. A release
          # gives its tagged commit: the release PR's merge on main, tagged minutes later.
          # A commit that merged after it deploys on the next push or scheduled run.
          ref: ${{ github.sha }}
          # `open-interpretability check` checks the errata file's signature at the time it landed,
          # which needs main's history (openinterpretability/signing.py landing_times).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # The evidence blobs of slim records (openinterpretability/core/evidence.py, issue #3254), so
      # this build fetches only the blobs of new records from the dataset.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/openinterpretability/evidence
          key: evidence-blobs-${{ github.run_id }}
          restore-keys: evidence-blobs-
      - name: Publish the evidence of merged records
        # Merged code only: this job checks out main. It uploads the blobs that main's slim
        # records need and the dataset lacks, from the evidence branches (issue #3254). A
        # PR's CI holds no write token, so nothing from an unmerged PR is published.
        env:
          HF_TOKEN: ${{ secrets.HF_EVIDENCE_TOKEN }}
        run: open-interpretability evidence publish
      - name: Check registry consistency
        run: open-interpretability check
      # The personal-data matches of each text that earlier builds searched
      # (openinterpretability/builder/pii.py), so this build searches only new text.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/openinterpretability/pii
          key: pii-spans-${{ github.run_id }}
          restore-keys: pii-spans-
      # The author of the PR that merged each record without a contributor
      # (openinterpretability/builder/users.py), so this build asks GitHub only for new PRs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/openinterpretability/pr-authors
          key: pr-authors-${{ github.run_id }}
          restore-keys: pr-authors-
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}  # reads PR authors from the API
          # Swap that the build may use above its cap (scripts/capped.sh).
          CAPPED_SWAP: 2G
        # The build runs under a 6G cap plus 2G of swap, out of the runner's 16 GB
        # (scripts/capped.sh, #4592), so the runner agent keeps the rest. Above
        # the cap, the kernel stops only the build, and the step fails at once with an
        # out-of-memory error. With no cap, the kernel killed the runner agent too, and
        # the run hung for about 45 minutes with no reason in the log.
        # The build holds each record slim and streams the Parquet (#4652). With its
        # default jobs its process memory peaked at 2.8-2.9 GiB, down from 14.0 GiB (#4737).
        # The cap leaves room above that and gives the runner agent the rest. The warning
        # above 4G shows a regression early.
        run: |
          scripts/capped.sh 6G 4G -- \
            open-interpretability build --wiki-dir wiki --output-dir dist
          python -m openinterpretability.builder.css --site dist
          python -m pagefind --site dist
      - name: Sync to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          # Optional: purge changed URLs from the Cloudflare cache (custom domain only).
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OPENINTERPRETABILITY_SITE_URL: ${{ vars.OPENINTERPRETABILITY_SITE_URL }}
        # `shell: bash` sets pipefail. With the default shell, `| tee` hid a failed deploy:
        # on 2026-11-15 a refused cache purge (HTTP 401) left the run green.
        shell: bash
        run: |
          status=0
          open-interpretability deploy --dist-dir dist --bucket "$R2_BUCKET" --delete 2>&1 \
            | tee deploy.log || status=$?
          {
            echo "### Registry deploy"
            echo
            tail -n 2 deploy.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Post new published papers and site posts to X, once the site that the posts link to
      # is live (#4463, #5533). The state of what was posted lives in the Actions cache. A
      # cache key can't be overwritten, so each run saves under its own key, and the restore
      # takes the newest. With no cache, the first run records every entry and posts nothing.
      # With the secrets unset, nothing is posted. A failure here never fails the deploy.
      - name: Restore the social state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .social
          key: social-x-${{ github.run_id }}
          restore-keys: social-x-
      - name: Post new results to X
        id: x
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          REPOST: ${{ inputs.repost }}  # a dispatch input; empty on every other event
        shell: bash
        run: |
          set -o pipefail  # the step fails when the command fails, not when tee succeeds
          args=()
          for id in $REPOST; do args+=(--repost "$id"); done
          # --record: what posted, outside .social, which the cache would bring back (#5840)
          open-interpretability social post --record x-posted.json "${args[@]}" 2>&1 | tee x.log
      - name: Keep the posts for the link PR
        id: posted
        if: ${{ always() && hashFiles('x-posted.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: x-posted
          path: x-posted.json
          retention-days: 7
      # A failed post leaves the deploy green, so report-x opens an issue for it. Only the
      # HTTP status goes on: a fixed field, not log text, since agents work that issue.
      - name: Read the post's HTTP status
        id: x_error
        if: ${{ steps.x.outcome == 'failure' }}
        shell: bash
        run: |
          error=$(grep -o -m1 'HTTP Error [0-9]\{3\}' x.log || echo "no HTTP status")
          echo "error=$error" >> "$GITHUB_OUTPUT"
          echo "Posting to X failed: $error. The deploy itself passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Save the social state
        if: ${{ always() && hashFiles('.social/x.json') != '' }}
        continue-on-error: true  # a rerun of this run finds its key taken
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .social
          key: social-x-${{ github.run_id }}

  # Each new post's X link goes into its paper's or post's folder, through a PR (#5840). The
  # page shows it once that PR merges. LEDGER_TOKEN opens the PR as the maintainer, as for
  # the benchmark ledger (#4215), so its CI runs and auto-merge.yml merges it on green. A PR
  # that github.token opens starts no CI. Only this job may write. Each run opens its own
  # PR, so no link waits on another. The deploy after the merge posts nothing again: the
  # social state holds each entry's id, its page's URL, which the link doesn't change.
  x-links:
    name: Link papers and posts to their X posts
    needs: deploy
    if: ${{ needs.deploy.outputs.x_posted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the link branch
      pull-requests: write  # the link PR, when LEDGER_TOKEN is unset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: x-posted
      - name: Open the link PR
        env:
          GH_TOKEN: ${{ secrets.LEDGER_TOKEN || github.token }}
          RUN: ${{ github.run_id }}
        run: |
          uv run --quiet open-interpretability social link x-posted.json
          if [ -z "$(git status --porcelain -- papers posts)" ]; then
            echo "No folder to link."
            exit 0
          fi
          branch="social/x-links-$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add papers posts
          git commit -m "X links: run $RUN"
          git push origin "$branch"
          names=$(git diff --name-only HEAD~1 | cut -d/ -f2 | sort -u | paste -sd, -)
          body="Each paper's or post's X post, from deploy run $RUN (issue #5840)."
          gh pr create --base main --head "$branch" --title "X links: $names" \
            --body "$body It merges by itself once CI passes."

  # A failed deploy leaves the site stale, and nobody sees it unless they look at Actions
  # (#4625). So a failure opens an issue, or comments on the one already open. The fixed
  # title keeps a cron that fails every 30 minutes to one issue. A later good deploy
  # doesn't close it: a failure that went away by itself is a flaky deploy, and the
  # issue stays open until its cause is fixed. scripts/issue_state.py
  # reads TITLE from this file, so the issue is eligible for agents.
  report:
    name: Open an issue on failure
    needs: [changed, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Deploy registry failed on main
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEAD: ${{ github.sha }}
      # Each failed job as a line: id, name, and its failed steps.
      FAILED_JOBS: >-
        .jobs[] | select(.conclusion == "failure")
        | [.id, .name, ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))]
        | @tsv
    steps:
      - name: Open an issue, or comment on the open one
        shell: bash
        # The body holds fixed fields only: the run, the commit SHA, and the names of the
        # failed jobs and steps. It holds no commit message and no log, since a merged
        # PR's title and a log line are text from outside, and agents work this issue.
        run: |
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --jq "$FAILED_JOBS")
          {
            echo "Run: $RUN"
            echo "Commit: $HEAD"
            echo
            echo "The site keeps its last good build until a deploy succeeds. The run's logs"
            echo "say why it failed: \`gh run view $GITHUB_RUN_ID --log-failed\`."
            echo
            while IFS=$'\t' read -r id name steps; do
              [ -n "$id" ] || continue
              echo "- **$name** failed at: ${steps:-a step}"
            done <<< "$jobs"
          } > issue.md
          # Only an issue that this workflow opened: anyone can open one with this title.
          number=$(gh issue list --state open --author app/github-actions \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md \
              --label bug --label "priority: high" --label "area: site"
          fi

  # A failed post to X leaves the deploy green (continue-on-error), so the report job
  # above never runs for it, and on 2026-11-20 every post failed unseen (#5528). This job
  # opens one issue, or comments on the open one, as the report job does. It is apart
  # from the deploy job, so that the job with the R2 secrets gets no issues: write token.
  # scripts/issue_state.py reads this TITLE too, so the issue is eligible for agents.
  report-x:
    name: Open an issue when posting to X fails
    needs: deploy
    if: ${{ needs.deploy.outputs.x_outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Posting to X failed on main
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEAD: ${{ github.sha }}
      ERROR: ${{ needs.deploy.outputs.x_error }}
    steps:
      - name: Open an issue, or comment on the open one
        shell: bash
        # Fixed fields only: the run, the commit and the HTTP status read in the deploy job.
        run: |
          case "$ERROR" in
            "HTTP Error "[0-9][0-9][0-9] | "no HTTP status") ;;
            *) ERROR="unknown" ;;
          esac
          {
            echo "Run: $RUN"
            echo "Commit: $HEAD"
            echo "Error: $ERROR"
            echo
            echo "The deploy passed, but \`open-interpretability social post\` failed. The"
            echo "posts wait for a later run. The log says why:"
            echo "\`gh run view $GITHUB_RUN_ID --log\`, step *Post new results to X*."
          } > issue.md
          # Only an issue that this workflow opened: anyone can open one with this title.
          number=$(gh issue list --state open --author app/github-actions \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md \
              --label bug --label "priority: high" --label "area: pipeline"
          fi
