name: Nightly reproduction

# CI reproduces only the records a pull request changes, so a torch or transformers
# upgrade that shifts activations in older records would go unnoticed. This re-runs a
# rotating sample of the whole registry (docs/PROTOCOL.md §5). It runs on main only, so it
# has no allow-list of models: main's records already passed review.

on:
  schedule:
    - cron: "41 3 * * *"  # off the top of the hour, when Actions is busiest
  workflow_dispatch:
    inputs:
      sample:
        description: Records to reproduce
        default: "20"
      date:
        description: Day that selects the records, YYYY-MM-DD (default today)
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: reproduce-nightly
  cancel-in-progress: false

jobs:
  reproduce:
    name: Reproduce a rotating sample
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Each signature is checked at the time it landed on main, which needs main's
          # history (openinterp/signing.py landing_times).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          ./scripts/ci-install.sh
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore model weights
        # main's model-cache job in ci.yml saves this cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-v2-
          restore-keys: hf-hub-v2-
      - name: Reproduce the sample
        # A time limit on the step, not only the job, so that the issue step still runs.
        timeout-minutes: 210
        shell: bash  # sets pipefail, so tee doesn't hide a failure
        env:
          SAMPLE: ${{ inputs.sample || '20' }}
          SAMPLE_DATE: ${{ inputs.date }}
        # The budget stops new records after 140 minutes. A Qwen2.5-1.5B record takes up
        # to ~57 minutes on this runner, so the last one ends inside the step's limit.
        # Records not reached wait for their next turn in the rotation, and don't fail.
        run: |
          flags=(--sample "$SAMPLE" --device cpu --time-budget 140)
          if [ -n "$SAMPLE_DATE" ]; then flags+=(--date "$SAMPLE_DATE"); fi
          openinterp reproduce "${flags[@]}" | tee reproduce.log
      - name: Open an issue, or comment on the open one
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Nightly reproduction failed
        run: |
          {
            # The runner sets these GITHUB_ variables in every job.
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Mismatches can mean a library upgrade shifted activations. No mismatches"
            echo "below means the job failed in another way, so read the run's log."
            echo
            echo '```text'
            grep -E '^(FAILED|::error)' reproduce.log | head -c 60000 || true
            echo '```'
          } > issue.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi
