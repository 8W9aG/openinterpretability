# Dependabot opens a pull request when a pinned dependency has a newer version.
# Workflows pin each action to a full commit SHA (with the tag as a comment), because
# CI decides which records to trust and a tag can be moved. These updates keep the
# pins current through reviewed pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
