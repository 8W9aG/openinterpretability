# APA 7 §8.11: a parenthetical citation has a comma before the year, as in
# "(Paulo et al., 2025)" or "(Hendrycks & Gimpel, 2016)". A month before a year is a date,
# not a citation, so it is left out.
extends: existence
message: "Put a comma before the year in '%s'."
level: error
nonword: true
raw:  # Vale joins these parts into one pattern
  - '\((?!(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* )'
  - '[A-Z][\w-]+(?: et al\.| & [A-Z][\w-]+)?'
  - ' (?:19|20)\d{2}[a-z]?\b'
