# Vale (vale.sh) lints the prose of comments and docstrings against our ASD-STE100 rules
# (.vale/styles/STE) and the APA 7 rules that a pattern can check (.vale/styles/APA, #3931).
# Run `make vale`. Why each rule exists is in .claude/skills/commenting/SKILL.md.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.py]
BasedOnStyles = STE, APA
