<text x="20.0" y="30.0" class="title">Neither variant recovers more explanations,</text>
<text x="20.0" y="53.0" class="title">and the failed-text loss loses more</text>
<text x="20.0" y="73.0" class="sub">The top K prune of each variant, on the paper&#x27;s 362 poles. Left: of the 63 that fail on the instruct</text>
<text x="20.0" y="91.0" class="sub">model, those that pass again. Right: of the 299 that keep on it, those that fail.</text>
