# The paper's X thread (labinacan/social/thread.py, #5833). Each blurb gives
# numbers from the paper only. {link} is the paper's URL.
- section: Introduction
  text: >-
    QLoRA stores a model's weights in 4-bit NF4. Do neuron explanations survive that
    rounding? We rounded every linear weight of Qwen2.5-0.5B and 1.5B to NF4 and re-tested each
    reviewed explanation. {link}
  media: [keep]
- section: Does an explanation keep when the weights are rounded to NF4?
  text: >-
    Most do: 281 of 362 on Qwen2.5-0.5B and 66 of 75 on Qwen2.5-1.5B. That is about what
    instruction tuning keeps on the same models.
- section: How far do the test prompts' readings drift?
  text: >-
    The 99% point of the drift is 33% of a pole's scale on Qwen2.5-0.5B and 21% on
    Qwen2.5-1.5B. In this repo's earlier bfloat16 test it was 3.2%.
- section: Which poles flip?
  text: >-
    The poles that flip sit near a review threshold. NF4 and instruction tuning share 38 flips on
    Qwen2.5-0.5B, against 14.0 by chance.
  media: [flips]
- section: Conclusion
  text: >-
    On Qwen2.5-1.5B, NF4 keeps more explanations than a random change of its size, 66
    against 58 to 62. The weights' normality does not tell which explanations break. {link}
