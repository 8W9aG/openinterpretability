<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" width="760" height="395" role="img">
<title>Necessity falls from 0.59 to 0.35, and patching from 0.81 to 0.37. Sufficiency stays at 0.55 and 0.57. The threshold is 0.5.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
@keyframes m0{0%{opacity:0}10.0%{opacity:1}100%{opacity:1}}.m0{animation:m0 8s step-end infinite;opacity:1}@keyframes m1{0%{opacity:0}50.0%{opacity:1}100%{opacity:1}}.m1{animation:m1 8s step-end infinite;opacity:1}</style>
<rect class="bg" width="760" height="395" rx="10"/>
<text x="20.0" y="30.0" class="title">The route stays sufficient on the instruct model,</text>
<text x="20.0" y="53.0" class="title">but it is no longer necessary</text>
<text x="20.0" y="73.0" class="sub">Each mark is one gate&#x27;s measure for the 33-unit route, on each model. The grey line is</text>
<text x="20.0" y="91.0" class="sub">the gate&#x27;s threshold. The route and its prompts are the same on both models.</text>
<path class="grid" d="M260.0 145.0L260.0 295.0"/>
<text x="260.0" y="310.0" class="small" text-anchor="middle">0.00</text>
<path class="grid" d="M370.0 145.0L370.0 295.0"/>
<text x="370.0" y="310.0" class="small" text-anchor="middle">0.25</text>
<path class="grid" d="M480.0 145.0L480.0 295.0"/>
<text x="480.0" y="310.0" class="small" text-anchor="middle">0.50</text>
<path class="grid" d="M590.0 145.0L590.0 295.0"/>
<text x="590.0" y="310.0" class="small" text-anchor="middle">0.75</text>
<path class="grid" d="M700.0 145.0L700.0 295.0"/>
<text x="700.0" y="310.0" class="small" text-anchor="middle">1.00</text>
<path class="dip" d="M480.0 145.0L480.0 295.0"/>
<text x="20.0" y="174.0" class="small">necessity</text>
<path class="grid" d="M415.5 170.0L521.4 170.0"/>
<circle class="fc1 ring m0" cx="521.4" cy="170.0" r="6"/>
<path class="fc2 ring m1" d="M415.5 162.8L422.7 175.8L408.3 175.8Z"/>
<text x="20.0" y="224.0" class="small">sufficiency</text>
<path class="grid" d="M510.6 220.0L501.9 220.0"/>
<circle class="fc1 ring m0" cx="501.9" cy="220.0" r="6"/>
<path class="fc2 ring m1" d="M510.6 212.8L517.8 225.8L503.4 225.8Z"/>
<text x="20.0" y="274.0" class="small">patching, the route&#x27;s own prompt</text>
<path class="grid" d="M422.8 270.0L614.8 270.0"/>
<circle class="fc1 ring m0" cx="614.8" cy="270.0" r="6"/>
<path class="fc2 ring m1" d="M422.8 262.8L430.0 275.8L415.6 275.8Z"/>
<text x="480.0" y="326.0" class="small" text-anchor="middle">the gate&#x27;s measure</text>
<circle class="fc1" cx="25.0" cy="343.0" r="5"/>
<text x="35.0" y="347.0" class="small">base model</text>
<path class="fc2" d="M115.0 337.0L121.0 347.8L109.0 347.8Z"/>
<text x="125.0" y="347.0" class="small">instruct model</text>
</svg>
