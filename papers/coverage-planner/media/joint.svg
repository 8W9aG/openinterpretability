<text x="20.0" y="30.0" class="title">Planned together, 8 prompts need 118 experiments,</text>
<text x="20.0" y="53.0" class="title">against 160 when each prompt is planned alone</text>
<text x="20.0" y="73.0" class="sub">Experiments to bring every prompt of the first k to a coverage of 0.9.</text>
<text x="20.0" y="91.0" class="sub">A unit that two prompts share counts once in the middle bar.</text>
