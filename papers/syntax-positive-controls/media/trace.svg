<text x="20.0" y="30.0" class="title">L2 N676+ climbs as brackets open, and drops as soon as they close</text>
<text x="20.0" y="50.0" class="sub">One Python function, written for this paper, read token by token. The dot follows the pole&#x27;s strength.</text>
<text x="20.0" y="68.0" class="sub">Below is the parser&#x27;s bracket depth. The pole also fires on brackets in a comment and in a string.</text>
