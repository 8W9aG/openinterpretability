<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" role="img">
<title>Two aligned plots over the tokens of a short function. The pole&#x27;s strength is zero outside brackets and rises to about 9 at depth 4. It is also about 3 to 4 inside brackets in a comment and in a string, where the parser&#x27;s depth stays at 0.</title>
