acity:1}@keyframes step17{0%{opacity:0}82.7%{opacity:1}100%{opacity:1}}.step17{animation:step17 10s step-end infinite;opacity:1}@keyframes step18{0%{opacity:0}87.4%{opacity:1}100%{opacity:1}}.step18{animation:step18 10s step-end infinite;opacity:1}</style>
<rect class="bg" width="760" height="485" rx="10"/>
<text x="20.0" y="30.0" class="title">As ROME edits pile up, the explanations above the layer fade steadily,</text>
<text x="20.0" y="53.0" class="title">with no threshold, and more slowly than under random edits of the same size</text>
<text x="20.0" y="73.0" class="sub">Each mark is a checkpoint: the 88 VERIFIED poles above layer 2 that still pass, against ‖ΔW‖/‖W₀‖.</text>
<text x="20.0" y="91.0" class="sub">The curves are N·exp(−h·distance), fitted to each sequence.</text>
