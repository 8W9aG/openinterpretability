<text x="20.0" y="53.0" class="title">miss by a probe or two, then pass again</text>
<text x="20.0" y="73.0" class="sub">Each row is a pole whose explanation holds at step 16,000 and fails later.</text>
<text x="20.0" y="91.0" class="sub">A circle holds. A triangle fails, with the number of probes it fell short by.</text>
<text x="20.0" y="109.0" class="sub">18 of the 23 failures are within two probes. Every explanation holds at step 143,000 by selection.</text>
