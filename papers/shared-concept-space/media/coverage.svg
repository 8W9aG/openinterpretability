<text x="80.0" y="432.0" class="small" text-anchor="middle">7 regions</text>
<text x="253.3" y="432.0" class="small" text-anchor="middle">14 regions</text>
<text x="426.7" y="432.0" class="small" text-anchor="middle">29 regions</text>
<text x="600.0" y="432.0" class="small" text-anchor="middle">60 regions</text>
