<text x="83.0" y="208.3" class="small" text-anchor="end">0.25</text>
<path class="grid" d="M90.0 161.0L510.0 161.0"/>
<text x="83.0" y="165.0" class="small" text-anchor="end">0.30</text>
<text x="150.0" y="436.0" class="small" text-anchor="middle">α = 0.05</text>
<text x="450.0" y="436.0" class="small" text-anchor="middle">α = 0.01</text>
<path class="line sneutral dash" d="M150.0 377.7L450.0 412.3"/>
<text x="142.0" y="381.7" class="small" text-anchor="end">α</text>
<path class="curve" d="M150.0 394.4L450.0 413.6"/>
<circle class="fc1 ring" cx="150.0" cy="394.4" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="413.6" r="3.5"/>
<path class="curve" d="M150.0 367.3L450.0 406.9"/>
<circle class="fc1 ring" cx="150.0" cy="367.3" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="406.9" r="3.5"/>
<path class="curve" d="M150.0 276.5L450.0 363.2"/>
<circle class="fc1 ring" cx="150.0" cy="276.5" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="363.2" r="3.5"/>
