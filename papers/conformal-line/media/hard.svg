<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" role="img">
<title>A slope chart of four models. At α = 0.05 the probes predicted quiet fire at 3.1% in Pythia-70m, 6.2% in GPT-2, 16.7% in Qwen2.5-0.5B, 26.2% in Qwen2.5-1.5B.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.dash{stroke-dasharray:6 4}</style>
<rect class="bg" width="760" height="476" rx="10"/>
<text x="20.0" y="30.0" class="title">Quiet probes fire far above the bound in Qwen2.5, and near it in Pythia-70m and GPT-2</text>
<text x="20.0" y="50.0" class="sub">The share of each model&#x27;s probes predicted quiet that fire under the conformal</text>
<text x="20.0" y="68.0" class="sub">line, pooled over its poles, at α = 0.05 and α = 0.01. The dashed line is α itself:</text>
<text x="20.0" y="86.0" class="sub">the rate the guarantee bounds on corpus text. Each model&#x27;s line is labelled.</text>
<text x="90.0" y="130.0" class="head">Probes predicted quiet that fire</text>
<path class="grid" d="M90.0 398.0L510.0 398.0"/>
<text x="83.0" y="402.0" class="small" text-anchor="end">0.00</text>
<path class="grid" d="M90.0 354.7L510.0 354.7"/>
<text x="83.0" y="358.7" class="small" text-anchor="end">0.05</text>
<path class="grid" d="M90.0 311.3L510.0 311.3"/>
<text x="83.0" y="315.3" class="small" text-anchor="end">0.10</text>
<path class="grid" d="M90.0 268.0L510.0 268.0"/>
<text x="83.0" y="272.0" class="small" text-anchor="end">0.15</text>
<path class="grid" d="M90.0 224.7L510.0 224.7"/>
<text x="83.0" y="228.7" class="small" text-anchor="end">0.20</text>
<path class="grid" d="M90.0 181.3L510.0 181.3"/>
<text x="83.0" y="185.3" class="small" text-anchor="end">0.25</text>
<path class="grid" d="M90.0 138.0L510.0 138.0"/>
<text x="83.0" y="142.0" class="small" text-anchor="end">0.30</text>
<text x="150.0" y="413.0" class="small" text-anchor="middle">α = 0.05</text>
<text x="450.0" y="413.0" class="small" text-anchor="middle">α = 0.01</text>
<path class="line sneutral dash" d="M150.0 354.7L450.0 389.3"/>
<text x="142.0" y="358.7" class="small" text-anchor="end">α</text>
<path class="curve" d="M150.0 371.4L450.0 390.6"/>
<circle class="fc1 ring" cx="150.0" cy="371.4" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="390.6" r="3.5"/>
<path class="curve" d="M150.0 344.3L450.0 383.9"/>
<circle class="fc1 ring" cx="150.0" cy="344.3" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="383.9" r="3.5"/>
<path class="curve" d="M150.0 253.5L450.0 340.2"/>
<circle class="fc1 ring" cx="150.0" cy="253.5" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="340.2" r="3.5"/>
<path class="curve" d="M150.0 170.9L450.0 296.3"/>
<circle class="fc1 ring" cx="150.0" cy="170.9" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="296.3" r="3.5"/>
<text x="468.0" y="300.3" class="small">Qwen2.5-1.5B: 26.2% → 11.7%</text>
<text x="468.0" y="344.2" class="small">Qwen2.5-0.5B: 16.7% → 6.7%</text>
<text x="468.0" y="387.9" class="small">GPT-2: 6.2% → 1.6%</text>
<text x="468.0" y="400.9" class="small">Pythia-70m: 3.1% → 0.9%</text>
</svg>
