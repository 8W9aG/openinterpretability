<circle class="fc1 ring" cx="150.0" cy="193.9" r="3.5"/>
<circle class="fc1 ring" cx="450.0" cy="319.3" r="3.5"/>
<text x="468.0" y="323.3" class="small">Qwen2.5-1.5B: 26.2% → 11.7%</text>
<text x="468.0" y="367.2" class="small">Qwen2.5-0.5B: 16.7% → 6.7%</text>
<text x="468.0" y="410.9" class="small">GPT-2: 6.2% → 1.6%</text>
<text x="468.0" y="423.9" class="small">Pythia-70m: 3.1% → 0.9%</text>
</svg>
