<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" role="img">
<title>Bar charts of added cross-entropy. In GPT-2 the negative clamp adds 0.19 nats, the negative zero 3.72, the positive clamp 1.34. In Qwen both clamps add 2.46.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
</style>
<rect class="bg" width="760" height="388" rx="10"/>
<text x="20.0" y="30.0" class="title">Most of the negative side&#x27;s cost in GPT-2 is its level, not its variation</text>
<text x="20.0" y="50.0" class="sub">All layers changed at once. In GPT-2 a clamp costs 0.19 nats and a zero 3.72. In Qwen the two clamps cost the same.</text>
<circle class="fc1" cx="25.0" cy="80.0" r="5"/>
<text x="35.0" y="84.0">Negative side</text>
<circle class="fc2" cx="136.8" cy="80.0" r="5"/>
<text x="146.8" y="84.0">Positive side</text>
<circle class="fneutral" cx="248.6" cy="80.0" r="5"/>
<text x="258.6" y="84.0">Shuffled null</text>
<circle class="fc3" cx="360.4" cy="80.0" r="5"/>
<text x="370.4" y="84.0">Both sides</text>
<text x="176.0" y="110.0" class="head">GPT-2 small (GELU)</text>
<path class="grid" d="M176.0 118.0L176.0 340.0"/>
<text x="176.0" y="355.0" class="small" text-anchor="middle">0</text>
<path class="grid" d="M228.6 118.0L228.6 340.0"/>
<text x="228.6" y="355.0" class="small" text-anchor="middle">2</text>
<path class="grid" d="M281.2 118.0L281.2 340.0"/>
<text x="281.2" y="355.0" class="small" text-anchor="middle">4</text>
<path class="grid" d="M333.8 118.0L333.8 340.0"/>
<text x="333.8" y="355.0" class="small" text-anchor="middle">6</text>
<path class="grid" d="M386.4 118.0L386.4 340.0"/>
<text x="386.4" y="355.0" class="small" text-anchor="middle">8</text>
<path class="axis" d="M176.0 118.0L176.0 340.0"/>
<text x="307.5" y="371.0" class="small" text-anchor="middle">added cross-entropy (nats)</text>
<text x="166.0" y="137.9" text-anchor="end">Negative side, shuffled</text>
<rect class="fneutral" x="176.0" y="124.0" width="2.1" height="19.7" rx="1.5"/>
<text x="183.1" y="137.9" class="small">0.08</text>
<text x="166.0" y="169.6" text-anchor="end">Negative side, clamped</text>
<rect class="fc1" x="176.0" y="155.7" width="4.9" height="19.7" rx="1.5"/>
<text x="185.9" y="169.6" class="small">0.19</text>
<text x="166.0" y="201.3" text-anchor="end">Positive side, shuffled</text>
<rect class="fneutral" x="176.0" y="187.4" width="21.7" height="19.7" rx="1.5"/>
<text x="202.7" y="201.3" class="small">0.82</text>
<text x="166.0" y="233.0" text-anchor="end">Positive side, clamped</text>
<rect class="fc2" x="176.0" y="219.1" width="35.3" height="19.7" rx="1.5"/>
<text x="216.3" y="233.0" class="small">1.34</text>
<text x="166.0" y="264.7" text-anchor="end">Negative side, zero</text>
<rect class="fc1" x="176.0" y="250.9" width="98.0" height="19.7" rx="1.5"/>
<text x="279.0" y="264.7" class="small">3.72</text>
<text x="166.0" y="296.4" text-anchor="end">Positive side, zero</text>
<rect class="fc2" x="176.0" y="282.6" width="211.7" height="19.7" rx="1.5"/>
<text x="392.7" y="296.4" class="small">8.05</text>
<text x="166.0" y="328.1" text-anchor="end">Every neuron at its mean</text>
<rect class="fc3" x="176.0" y="314.3" width="107.7" height="19.7" rx="1.5"/>
<text x="288.7" y="328.1" class="small">4.09</text>
<text x="473.0" y="110.0" class="head">Qwen2.5-0.5B (SwiGLU)</text>
<path class="grid" d="M473.0 118.0L473.0 340.0"/>
<text x="473.0" y="355.0" class="small" text-anchor="middle">0</text>
<path class="grid" d="M525.6 118.0L525.6 340.0"/>
<text x="525.6" y="355.0" class="small" text-anchor="middle">2</text>
<path class="grid" d="M578.2 118.0L578.2 340.0"/>
<text x="578.2" y="355.0" class="small" text-anchor="middle">4</text>
<path class="grid" d="M630.8 118.0L630.8 340.0"/>
<text x="630.8" y="355.0" class="small" text-anchor="middle">6</text>
<path class="grid" d="M683.4 118.0L683.4 340.0"/>
<text x="683.4" y="355.0" class="small" text-anchor="middle">8</text>
<path class="axis" d="M473.0 118.0L473.0 340.0"/>
<text x="604.5" y="371.0" class="small" text-anchor="middle">added cross-entropy (nats)</text>
<rect class="fneutral" x="473.0" y="124.0" width="29.1" height="19.7" rx="1.5"/>
<text x="507.1" y="137.9" class="small">1.11</text>
<rect class="fc1" x="473.0" y="155.7" width="64.8" height="19.7" rx="1.5"/>
<text x="542.8" y="169.6" class="small">2.46</text>
<rect class="fneutral" x="473.0" y="187.4" width="30.5" height="19.7" rx="1.5"/>
<text x="508.5" y="201.3" class="small">1.16</text>
<rect class="fc2" x="473.0" y="219.1" width="64.7" height="19.7" rx="1.5"/>
<text x="542.7" y="233.0" class="small">2.46</text>
<rect class="fc1" x="473.0" y="250.9" width="143.0" height="19.7" rx="1.5"/>
<text x="621.0" y="264.7" class="small">5.44</text>
<rect class="fc2" x="473.0" y="282.6" width="224.7" height="19.7" rx="1.5"/>
<text x="702.7" y="296.4" class="small">8.54</text>
<rect class="fc3" x="473.0" y="314.3" width="233.9" height="19.7" rx="1.5"/>
<text x="711.9" y="328.1" class="small">8.89</text>
</svg>
