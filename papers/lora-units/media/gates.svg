<text x="20.0" y="50.0" class="sub">Each mark is one unit: the share of hard negatives it stays inactive on, and the share of</text>
<text x="20.0" y="68.0" class="sub">held-out positives it fires on. A unit must reach both grey lines to pass.</text>
