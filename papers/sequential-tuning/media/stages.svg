<text x="20.0" y="30.0" class="title">After three narrow fine-tunes, a quarter of the</text>
<text x="20.0" y="53.0" class="title">explanations fail, and ARC-Easy ends near its start</text>
<text x="20.0" y="73.0" class="sub">362 VERIFIED poles of Qwen2.5-0.5B, each re-read on its own probes after each stage.</text>
<text x="20.0" y="91.0" class="sub">Left: the share that still passes both gates. Right: zero-shot ARC-Easy accuracy. Bars: 95% intervals.</text>
