<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" role="img">
<title>Line plots of rest against training step for layers 0 to 3. The baseline and the centred learned rest fall together. At L1 they reach minus 1.46 and minus 1.32 by step 12,000.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
@keyframes reveal{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}.reveal{transform-box:fill-box;transform-origin:left;animation:reveal 9s linear infinite}</style>
<rect class="bg" width="760" height="364" rx="10"/>
<text x="20.0" y="30.0" class="title">Two routes reach the rest at nearly the same pace, and −1 is not where it stops</text>
<text x="20.0" y="50.0" class="sub">With centring, the weights can&#x27;t set the rest, so a learned value for each neuron does it. Seed 0.</text>
<circle class="fc1" cx="25.0" cy="80.0" r="5"/>
<text x="35.0" y="84.0">Baseline: the weights set it</text>
<circle class="fc2" cx="235.8" cy="80.0" r="5"/>
<text x="245.8" y="84.0">Centred: a learned value sets it</text>
<text x="48.0" y="112.0" class="head">L0</text>
<path class="grid" d="M48.0 120.0L48.0 316.0"/>
<text x="48.0" y="331.0" class="small" text-anchor="middle">0</text>
<path class="grid" d="M125.8 120.0L125.8 316.0"/>
<text x="125.8" y="331.0" class="small" text-anchor="middle">6k</text>
<path class="grid" d="M203.5 120.0L203.5 316.0"/>
<text x="203.5" y="331.0" class="small" text-anchor="middle">12k</text>
<path class="grid" d="M48.0 299.2L203.5 299.2"/>
<text x="41.0" y="303.2" class="small" text-anchor="end">−1.5</text>
<path class="grid" d="M48.0 243.2L203.5 243.2"/>
<text x="41.0" y="247.2" class="small" text-anchor="end">−1.0</text>
<path class="grid" d="M48.0 187.2L203.5 187.2"/>
<text x="41.0" y="191.2" class="small" text-anchor="end">−0.5</text>
<path class="grid" d="M48.0 131.2L203.5 131.2"/>
<text x="41.0" y="135.2" class="small" text-anchor="end">0.0</text>
<path class="dip" d="M48.0 215.4L203.5 215.4"/>
