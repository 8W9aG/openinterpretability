<text x="20.0" y="30.0" class="title">Neurons rest low under one-sided activations, with or without a dip</text>
<text x="20.0" y="50.0" class="sub">Each moving dot is one layer&#x27;s median neuron (L1–L3), measured every 500 steps on small models.</text>
<text x="20.0" y="68.0" class="sub">Training starts at h ≈ 0 (open circle). ReLU has no dip, and its neurons go as deep as GELU&#x27;s.</text>
