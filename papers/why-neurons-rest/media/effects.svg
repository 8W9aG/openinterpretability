<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img">
<title>Dot plots of median pre-activation by condition for layers 0 to 3. At L1 to L3, width, dropout, weight decay and ReLU stay close to the baseline, and tanh sits at 0.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
</style>
<rect class="bg" width="760" height="416" rx="10"/>
<text x="20.0" y="30.0" class="title">Width and regularisation barely move the rest, and only tanh removes it</text>
<text x="20.0" y="50.0" class="sub">Median h at step 4,000, each panel one layer. The pale blue line is the baseline. The grey line is the</text>
<text x="20.0" y="68.0" class="sub">dip. L0 is the exception: it reads the embeddings, and it deepens with dropout on this one seed.</text>
<circle class="fc1" cx="25.0" cy="98.0" r="5"/>
<text x="35.0" y="102.0">Seed 0</text>
<circle class="open sc1" cx="90.6" cy="98.0" r="5"/>
<text x="100.6" y="102.0">Seed 1, where it ran</text>
<text x="128.0" y="154.5" class="ink" text-anchor="end">Baseline (GELU)</text>
<text x="128.0" y="183.5" text-anchor="end">1× width</text>
<text x="128.0" y="212.5" text-anchor="end">16× width</text>
<text x="128.0" y="241.5" text-anchor="end">No dropout</text>
<text x="128.0" y="270.5" text-anchor="end">Dropout 0.3</text>
<text x="128.0" y="299.5" text-anchor="end">Weight decay 0.1</text>
<text x="128.0" y="328.5" text-anchor="end">ReLU</text>
<text x="128.0" y="357.5" text-anchor="end">Tanh</text>
<text x="275.5" y="128.0" class="head" text-anchor="end">L0</text>
