<text x="20.0" y="30.0" class="title">Held at the same rest, the push depends on the depth</text>
<text x="20.0" y="50.0" class="sub">Push ratio of runs whose h is centred and held at a fixed rest, median over neurons, mean over</text>
<text x="20.0" y="68.0" class="sub">L1–L3, seed 0. Left: held at 0. Right: the mean over steps 1–4,000 at each held rest.</text>
