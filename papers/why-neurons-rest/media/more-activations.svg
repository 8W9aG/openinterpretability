<rect class="bg" width="760" height="388" rx="10"/>
<text x="20.0" y="30.0" class="title">Every one-sided activation rests below 0, but neither a dip nor a floor sets the depth</text>
<text x="20.0" y="50.0" class="sub">Each moving dot is one layer&#x27;s median neuron (L1–L3), every 500 steps. Softplus has no dip and goes deepest.</text>
<text x="20.0" y="68.0" class="sub">SiLU&#x27;s dip is deeper than GELU&#x27;s, yet it rests shallower. Leaky ReLU passes 10% below 0 and rests shallower than ReLU.</text>
