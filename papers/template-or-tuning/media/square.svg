<text x="410.0" y="204.0" class="small" text-anchor="end">0.81</text>
<path class="grid" d="M417.0 145.0L736.0 145.0"/>
<text x="410.0" y="149.0" class="small" text-anchor="end">0.84</text>
<text x="417.0" y="137.0" class="head">mean sensitivity</text>
<path class="line sc1" d="M482.7 190.4L670.3 300.5"/>
<circle class="fc1 ring" cx="482.7" cy="190.4" r="5"/>
<text x="470.7" y="194.4" class="ink" text-anchor="end">0.815</text>
