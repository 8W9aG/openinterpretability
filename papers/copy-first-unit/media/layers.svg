<text x="20.0" y="30.0" class="title">By layer 4 the right unit is near the top, but the copied unit stays first</text>
<text x="20.0" y="50.0" class="sub">The rank of the right answer (solid) and of the copied unit (dashed) at the</text>
<text x="20.0" y="68.0" class="sub">answer position, under the logit lens after each layer. Rank 1 is at the top.</text>
<text x="20.0" y="86.0" class="sub">A moving dot steps along the right answer&#x27;s line, layer by layer.</text>
