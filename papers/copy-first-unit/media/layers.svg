<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 582" width="760" height="582" role="img">
<title>Six small panels, one per wrong prompt. In each, both ranks climb from the thousands toward the top; the copied unit reaches rank 1 by layer 3 or 4, and the right unit stays at rank 2 to 6.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.dash{stroke-dasharray:6 4}@keyframes rank0{0.0%{transform:translate(64.0px,256.1px)}16.0%{transform:translate(102.0px,224.2px)}32.0%{transform:translate(140.0px,200.8px)}48.0%{transform:translate(178.0px,158.2px)}64.0%{transform:translate(216.0px,153.0px)}80.0%{transform:translate(254.0px,153.0px)}100%{transform:translate(254.0px,153.0px)}}.rank0{animation:rank0 7s step-end infinite;transform:translate(254.0px,153.0px)}@keyframes rank1{0.0%{transform:translate(296.0px,186.1px)}16.0%{transform:translate(334.0px,210.2px)}32.0%{transform:translate(372.0px,194.1px)}48.0%{transform:translate(410.0px,190.3px)}64.0%{transform:translate(448.0px,158.2px)}80.0%{transform:translate(486.0px,161.9px)}100%{transform:translate(486.0px,161.9px)}}.rank1{animation:rank1 7s step-end infinite;transform:translate(486.0px,161.9px)}@keyframes rank2{0.0%{transform:translate(528.0px,283.5px)}16.0%{transform:translate(566.0px,276.1px)}32.0%{transform:translate(604.0px,270.9px)}48.0%{transform:translate(642.0px,161.9px)}64.0%{transform:translate(680.0px,158.2px)}80.0%{transform:translate(718.0px,153.0px)}100%{transform:translate(718.0px,153.0px)}}.rank2{animation:rank2 7s step-end infinite;transform:translate(718.0px,153.0px)}@keyframes rank3{0.0%{transform:translate(64.0px,409.1px)}16.0%{transform:translate(102.0px,419.8px)}32.0%{transform:translate(140.0px,388.8px)}48.0%{transform:translate(178.0px,409.1px)}64.0%{transform:translate(216.0px,388.8px)}80.0%{transform:translate(254.0px,367.2px)}100%{transform:translate(254.0px,367.2px)}}.rank3{animation:rank3 7s step-end infinite;transform:translate(254.0px,367.2px)}@keyframes rank4{0.0%{transform:translate(296.0px,450.4px)}16.0%{transform:translate(334.0px,415.8px)}32.0%{transform:translate(372.0px,386.1px)}48.0%{transform:translate(410.0px,364.8px)}64.0%{transform:translate(448.0px,353.0px)}80.0%{transform:translate(486.0px,353.0px)}100%{transform:translate(486.0px,353.0px)}}.rank4{animation:rank4 7s step-end infinite;transform:translate(486.0px,353.0px)}@keyframes rank5{0.0%{transform:translate(528.0px,417.8px)}16.0%{transform:translate(566.0px,407.4px)}32.0%{transform:translate(604.0px,418.9px)}48.0%{transform:translate(642.0px,397.2px)}64.0%{transform:translate(680.0px,361.9px)}80.0%{transform:translate(718.0px,353.0px)}100%{transform:translate(718.0px,353.0px)}}.rank5{animation:rank5 7s step-end infinite;transform:translate(718.0px,353.0px)}@keyframes layernow0{0%{opacity:0}0.0%{opacity:1}16.0%{opacity:0}100%{opacity:0}}.layernow0{animation:layernow0 7s step-end infinite;opacity:0}@keyframes layernow1{0%{opacity:0}16.0%{opacity:1}32.0%{opacity:0}100%{opacity:0}}.layernow1{animation:layernow1 7s step-end infinite;opacity:0}@keyframes layernow2{0%{opacity:0}32.0%{opacity:1}48.0%{opacity:0}100%{opacity:0}}.layernow2{animation:layernow2 7s step-end infinite;opacity:0}@keyframes layernow3{0%{opacity:0}48.0%{opacity:1}64.0%{opacity:0}100%{opacity:0}}.layernow3{animation:layernow3 7s step-end infinite;opacity:0}@keyframes layernow4{0%{opacity:0}64.0%{opacity:1}80.0%{opacity:0}100%{opacity:0}}.layernow4{animation:layernow4 7s step-end infinite;opacity:0}@keyframes layernow5{0%{opacity:0}80.0%{opacity:1}100%{opacity:1}}.layernow5{animation:layernow5 7s step-end infinite;opacity:1}</style>
