<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" width="760" height="504" role="img">
<title>Six rows, one per wrong prompt. With the full prompt the right answer is rank 2 to 6. With the clause alone it is rank 1 to 15, and with the four facts before it rank 3 to 254.</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--neutral:#8a8985;--wash:#d9d8d2;--grid:#e8e7e2;--axis:#bdbcb5;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a299;--neutral:#8f8e86;--wash:#3f3f3b;--grid:#2c2c2a;--axis:#55554f;--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
.bg{fill:var(--surface)}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:17px;font-weight:600}
.sub{font-size:13px}
.head{fill:var(--ink);font-size:13px;font-weight:600}
.ink{fill:var(--ink)}
.small{fill:var(--muted);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.dip{stroke:var(--neutral);stroke-width:1}
.curve{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.range{stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.open{fill:var(--surface);stroke-width:2}
.soft{opacity:.25}
.ridge path{vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bg2{fill:var(--surface)}
.mesh{fill:none;stroke:var(--surface);stroke-width:.7;stroke-opacity:.8}
.contour{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dipfloor{stroke:var(--ink);stroke-width:1.4;stroke-opacity:.75}
.fc1{fill:var(--c1)}.fc2{fill:var(--c2)}.fc3{fill:var(--c3)}
.fneutral{fill:var(--neutral)}.fwash{fill:var(--wash)}
.sc1{stroke:var(--c1)}.sc2{stroke:var(--c2)}.sc3{stroke:var(--c3)}
.sneutral{stroke:var(--neutral)}.swash{stroke:var(--wash)}
.soft2{fill:none}</style>
<rect class="bg" width="760" height="504" rx="10"/>
<text x="20.0" y="30.0" class="title">Alone, the second clause rarely gets its right unit either</text>
<text x="20.0" y="50.0" class="sub">The right answer&#x27;s rank after the full prompt, after its second clause alone</text>
<text x="20.0" y="68.0" class="sub">(&quot;A year has twelve&quot;), and after that clause behind four unrelated facts.</text>
<text x="20.0" y="86.0" class="sub">Rank 1, at the left, is the model&#x27;s answer.</text>
<path class="grid" d="M200.0 140.0L200.0 404.0"/>
<text x="200.0" y="419.0" class="small" text-anchor="middle">1</text>
<path class="grid" d="M373.3 140.0L373.3 404.0"/>
<text x="373.3" y="419.0" class="small" text-anchor="middle">10</text>
<path class="grid" d="M546.7 140.0L546.7 404.0"/>
<text x="546.7" y="419.0" class="small" text-anchor="middle">100</text>
<path class="grid" d="M720.0 140.0L720.0 404.0"/>
<text x="720.0" y="419.0" class="small" text-anchor="middle">1,000</text>
<text x="460.0" y="435.0" class="small" text-anchor="middle">rank of the right answer (log scale)</text>
<text x="188.0" y="166.0" text-anchor="end">minutes, not seconds</text>
<rect class="fneutral" x="278.7" y="158.0" width="8.0" height="8.0" rx="1.5"/>
<circle class="ink" cx="252.2" cy="162.0" r="4"/>
<circle class="open sneutral soft2" cx="252.2" cy="162.0" r="7"/>
<text x="188.0" y="210.0" text-anchor="end">months, not days</text>
<rect class="fneutral" x="525.9" y="202.0" width="8.0" height="8.0" rx="1.5"/>
<circle class="ink" cx="304.4" cy="206.0" r="4"/>
<circle class="open sneutral soft2" cx="252.2" cy="206.0" r="7"/>
<text x="188.0" y="254.0" text-anchor="end">toes, not fingers</text>
<rect class="fneutral" x="612.8" y="246.0" width="8.0" height="8.0" rx="1.5"/>
<circle class="ink" cx="252.2" cy="250.0" r="4"/>
<circle class="open sneutral soft2" cx="403.9" cy="250.0" r="7"/>
<text x="188.0" y="298.0" text-anchor="end">months, not eggs</text>
<rect class="fneutral" x="525.9" y="290.0" width="8.0" height="8.0" rx="1.5"/>
<circle class="ink" cx="334.9" cy="294.0" r="4"/>
<circle class="open sneutral soft2" cx="252.2" cy="294.0" r="7"/>
<text x="188.0" y="342.0" text-anchor="end">seconds, not minutes</text>
<rect class="fneutral" x="394.7" y="334.0" width="8.0" height="8.0" rx="1.5"/>
<circle class="ink" cx="252.2" cy="338.0" r="4"/>
<circle class="open sneutral soft2" cx="282.7" cy="338.0" r="7"/>
<text x="188.0" y="386.0" text-anchor="end">days, not months</text>
<rect class="fneutral" x="520.0" y="378.0" width="8.0" height="8.0" rx="1.5"/>
<circle class="ink" cx="252.2" cy="382.0" r="4"/>
<circle class="open sneutral soft2" cx="200.0" cy="382.0" r="7"/>
<circle class="ink" cx="205.0" cy="446.0" r="5"/>
<text x="215.0" y="450.0">full prompt</text>
<circle class="open sneutral" cx="303.6" cy="446.0" r="5"/>
<text x="313.6" y="450.0">clause alone</text>
<rect class="fneutral" x="414.0" y="442.0" width="8.0" height="8.0" rx="1.5"/>
<text x="428.0" y="450.0">clause after four facts</text>
</svg>
