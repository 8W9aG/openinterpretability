# Secret scanning (.github/workflows/secret-scan.yml). The default rules, minus paths
# that hold third-party text: experiment records and pages quote corpus excerpts, and
# benchmark files quote them too. A key-shaped string there is not one of ours.
[extend]
useDefault = true

[[allowlists]]
description = "Corpus excerpts in records, pages and benchmark data"
paths = [
  '''^wiki/experiments/''',
  '''^wiki/draws/''',
  '''^benchmark/''',
]

# An ssh signer line's validity option, such as valid-before="20200101Z", in the signing
# tests. The generic rule takes the date for a key. It is a date, not a secret.
[[allowlists]]
description = "Validity dates of test ssh signer lines"
regexTarget = "line"
regexes = ['''valid-(before|after)="[0-9]{8}Z"''']
