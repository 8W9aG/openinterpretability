[project]
name = "openinterp"
dynamic = ["version"]
description = "Open Interpretability: an agent-audited mechanistic interpretability registry for native neurons in open-weight models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield", email = "will.sackfield@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "fasttext-predict>=0.9.2",
]

[project.urls]
Repository = "https://github.com/8W9aG/openinterpretability"

[project.scripts]
openinterp = "openinterp.cli:main"

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "pagefind[bin]>=1.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version is read from openinterp/__init__.py; reinstall when it changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "openinterp/__init__.py" }]

[tool.hatch.version]
path = "openinterp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openinterp"]

[tool.openinterp]
# Models `openinterp next` explores, weighted towards those with little coverage. Keep in
# sync with ALLOWED_MODELS in .github/workflows/ci.yml (tests/test_planner.py checks), so
# CI can reproduce every record the planner asks for. A new model also needs the checks
# under "Models" in TODO.md first.
models = ["Qwen/Qwen2.5-0.5B", "Qwen/Qwen2.5-1.5B", "openai-community/gpt2"]

[tool.openinterp.window_tokens]
# Scan window for models that read fewer positions than the corpus's longest documents.
# GPT-2 reads 1,024, but its transcoders fit only 128 (harness/dictionaries.py), and the
# learned-basis baseline compares latents with neuron poles scanned the same way.
"openai-community/gpt2" = 128

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hang fails within a minute, dumping every thread's stack and naming the test.
# "thread" because the hangs block in C (a semaphore wait), where SIGALRM never fires.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# D: docstrings, held to the commenting skill (.claude/skills/commenting/SKILL.md).
# ERA: commented-out code.
select = ["E", "F", "I", "B", "UP", "SIM", "D", "ERA"]
# Magic methods and __init__ are described by their class's docstring. D301 asks for r"""
# when a docstring has a backslash, but Click's `\b` (no rewrapping) must stay a real \b.
ignore = ["D105", "D107", "D301"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The docstring ratchet: paths not yet held to the D rules. Remove a line once its
# path passes `ruff check --select D`; never add one. (A `*` here also matches `/`,
# so top-level modules are listed one by one.)
"openinterp/baseline.py" = ["D"]
"openinterp/blends.py" = ["D"]
"openinterp/checks.py" = ["D"]
"openinterp/cli.py" = ["D"]
"openinterp/cli_baseline.py" = ["D"]
"openinterp/cli_costs.py" = ["D"]
"openinterp/cli_crossref.py" = ["D"]
"openinterp/cli_evidence.py" = ["D"]
"openinterp/cli_registry.py" = ["D"]
"openinterp/cli_review.py" = ["D"]
"openinterp/cli_submission.py" = ["D"]
"openinterp/concepts.py" = ["D"]
"openinterp/corpus.py" = ["D"]
"openinterp/crossref.py" = ["D"]
"openinterp/draw_steps.py" = ["D"]
"openinterp/evidence.py" = ["D"]
"openinterp/planner.py" = ["D"]
"openinterp/reproduce.py" = ["D"]
"openinterp/show.py" = ["D"]
"openinterp/sisters.py" = ["D"]
"openinterp/wiring_backfill.py" = ["D"]
"openinterp/agents/**" = ["D"]
"openinterp/builder/**" = ["D"]
"openinterp/data/**" = ["D"]
"openinterp/harness/**" = ["D"]
"openinterp/sync/**" = ["D"]
"scripts/**" = ["D"]
"tests/**" = ["D"]

[tool.interrogate]
# Docstring coverage of openinterp/, a ratchet like the D rules above: raise fail-under
# when coverage rises, never lower it. Skips what the D rules skip.
fail-under = 69
ignore-magic = true
ignore-init-method = true
ignore-private = true
ignore-semiprivate = true
ignore-module = false
