[project]
name = "openinterp"
dynamic = ["version"]
description = "Open Interpretability: an agent-audited mechanistic interpretability registry for native neurons in open-weight models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield", email = "will.sackfield@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "torch>=2.2.0",
    "transformers>=5.22.2",
    "accelerate>=0.30.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pyarrow>=26.0.1",
    "duckdb>=1.0.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "fasttext-predict>=0.9.2",
    "magika>=1.0.3,<2",
    "nltk>=3.8",
    "tldextract>=5.1",
    "presidio-analyzer>=2.2",
    "spacy-curated-transformers>=0.3,<1",
    "markdown-it-py>=4.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.25.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-scala>=0.26.11",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-haskell>=0.24.1",
    # Scans on Apple's Neural Engine (openinterp/harness/ane/, docs/experiments.md, Devices).
    "coremltools>=9.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://open-interpretability.com/"  # the site; builder and deploy read it
Repository = "https://github.com/8W9aG/openinterpretability"

[project.scripts]
openinterp = "openinterp.cli:main"

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "pagefind[bin]>=1.3.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version is read from openinterp/__init__.py; reinstall when it changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "openinterp/__init__.py" }]

[tool.hatch.version]
path = "openinterp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openinterp"]

[tool.openinterp]
# Models `openinterp next` explores: most draws go to the smallest model whose share is
# below `coverage_target` verified (default 80%), the rest to the others (`others_share`, default 0.2;
# openinterp/planner_models.py). Keep in
# sync with ALLOWED_MODELS in .github/workflows/ci.yml (tests/test_planner.py checks), so
# CI can reproduce every record the planner asks for. A new model also needs the checks
# under "Models" in TODO.md first.
models = ["Qwen/Qwen2.5-0.5B", "Qwen/Qwen2.5-1.5B", "openai-community/gpt2"]

[tool.openinterp.size_budget]
# scripts/repo_size.py warns in CI past these, and never fails (issue #3254). 1,000 MB is
# GitHub's recommended largest repository. Where records live in the long term is open.
tracked_mb = 1000
files = 20000

[tool.openinterp.window_tokens]
# Scan window for models that read fewer positions than the corpus's longest documents.
# GPT-2 reads 1,024, but its transcoders fit only 128 (harness/dictionaries.py), and the
# learned-basis baseline compares latents with neuron poles scanned the same way.
"openai-community/gpt2" = 128

# The terms of each model in `models` (openinterp.core.licenses.ModelLicense), which each
# model's site page shows. `license` and `gated` come from the model's Hub page, and
# `publishing_allowed` is our reading of the licence text. Checked on 2026-11-05.
# tests/test_planner.py checks that every configured model has an entry.
[tool.openinterp.licenses."Qwen/Qwen2.5-0.5B"]
license = "apache-2.0"
url = "https://huggingface.co/Qwen/Qwen2.5-0.5B/blob/main/LICENSE"
gated = false
publishing_allowed = true

[tool.openinterp.licenses."Qwen/Qwen2.5-1.5B"]
license = "apache-2.0"
url = "https://huggingface.co/Qwen/Qwen2.5-1.5B/blob/main/LICENSE"
gated = false
publishing_allowed = true

[tool.openinterp.licenses."openai-community/gpt2"]
license = "mit"
url = "https://github.com/openai/gpt-2/blob/master/LICENSE"
gated = false
publishing_allowed = true
conditions = "OpenAI's modified MIT licence asks users to say that content was created with GPT-2."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hang fails within a minute, dumping every thread's stack and naming the test.
# "thread" because the hangs block in C (a semaphore wait), where SIGALRM never fires.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored from danyuchn/asd-ste100-skill as is; upstream owns its style.
extend-exclude = [".claude/skills/asd-ste100"]

[tool.ruff.lint]
# D: docstrings, held to the commenting skill (.claude/skills/commenting/SKILL.md).
# ERA: commented-out code.
# S: Bandit's security checks (flake8-bandit), ported to Ruff.
select = ["E", "F", "I", "B", "UP", "SIM", "D", "ERA", "S"]
# Magic methods and __init__ are described by their class's docstring. D301 asks for r"""
# when a docstring has a backslash, but Click's `\b` (no rewrapping) must stay a real \b.
# S311: the random generators seed experiments and samples, never secrets.
# S603, S607: every subprocess call passes a list, never a shell string (S602 and S604 still
# apply), and runs a tool found on PATH (git, gh, ssh-keygen, uv). S603 flags every call.
ignore = ["D105", "D107", "D301", "S311", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings (D1): a test's name says what it checks, and a docstring that
# restates it is noise (.claude/skills/commenting/SKILL.md). The other D rules apply.
# Tests assert (S101), and give token fields fixed strings that S105 and S106 read as
# passwords. S314 parses SVG, and S608 queries parquet files, that the test itself wrote.
"tests/**" = ["D1", "S101", "S105", "S106", "S314", "S608"]
# A notebook checks its state with assert before a long run.
"*.ipynb" = ["S101"]

[tool.interrogate]
# Docstring coverage of openinterp/: raise fail-under when coverage rises, never lower it.
# Skips what the D rules skip.
fail-under = 94
ignore-magic = true
ignore-init-method = true
ignore-private = true
ignore-semiprivate = true
ignore-module = false

[tool.pymarkdown]
# The docs write one paragraph per line.
plugins.md013.enabled = false
# Keep a Changelog repeats `### Added` under each version.
plugins.md024.siblings_only = true
# A step's command block sits tight under its numbered list item in the skills.
plugins.md031.list_items = false
# The body of an agent definition is its prompt, and the PR template is a form. Neither starts with a title.
plugins.md041.enabled = false
# A code span here is often a model token, whose leading space is part of the token (` the`).
plugins.md038.enabled = false
# Skills, agents and Hub cards start with YAML front matter.
extensions.front-matter.enabled = true
