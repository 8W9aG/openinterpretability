[project]
name = "open-interpretability"
dynamic = ["version"]
description = "Open Interpretability: an agent-run mechanistic interpretability project, with an audited registry of native neurons in open-weight models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield", email = "will.sackfield+openinterpretability@gmail.com" }]
# The contact address: the footer and the about page (#5853). PyPI accepts no mailto URL (#6434).
maintainers = [{ name = "Open Interpretability", email = "contact@open-interpretability.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The generic lab code: site build, papers, figures, social and sync (8W9aG/labinacan,
    # #6736). An exact pin, so a change to it arrives only as a reviewed version bump (#7003).
    "labinacan[r2,pii]==0.1.4",
    "pydantic>=2.7.0",
    "torch>=2.2.0",
    "transformers>=5.22.2",
    "accelerate>=0.30.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pyarrow>=26.0.1",
    "duckdb>=1.0.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "fasttext-predict>=0.9.2",
    "magika>=1.0.3,<2",
    "nltk>=3.8",
    "tldextract>=5.1",
    "presidio-analyzer>=2.2",
    "spacy-curated-transformers>=0.3,<1",
    "markdown-it-py>=4.0",
    # LaTeX maths in papers, typeset at build time as MathML (#4211).
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81.1",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.25.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-scala>=0.26.11",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-haskell>=0.24.1",
    # Scans on Apple's Neural Engine (openinterpretability/harness/ane/, docs/experiments.md, Devices).
    "coremltools>=9.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://open-interpretability.com/"  # the site; builder and deploy read it
Repository = "https://github.com/8W9aG/openinterpretability"
X = "https://x.com/openinterpret"  # the footer and twitter:site (#5389)

[project.scripts]
open-interpretability = "openinterpretability.cli:main"

[project.optional-dependencies]
# `open-interpretability build` makes the site's search index with Pagefind.
site = ["pagefind[bin]>=1.3.0"]
# `open-interpretability map` lays out a model's studied neurons by meaning (#4422).
map = ["sentence-transformers>=5.0", "umap-learn>=0.5.7", "leidenalg>=0.10.2", "igraph>=0.11"]
mcp = [
    "mcp>=2.0",
]

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    "interrogate>=1.7.0",
    "mcp>=2.0",
    "mypy>=1.13",
    "mutmut==3.8.1",  # make mutation (scripts/mutation.py); pinned, as its internals are used
    "pagefind[bin]>=1.3.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=8.0.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "vulture>=2.16",
    "yamllint>=1.38.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version is read from openinterpretability/__init__.py; reinstall when it changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "openinterpretability/__init__.py" }]

[tool.hatch.version]
path = "openinterpretability/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openinterpretability"]

# The project's settings (`[tool.openinterpretability]` below) travel with an install, so
# commands run outside a clone read the same models, windows and licences (#3693).
[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "openinterpretability/data/pyproject.toml"

# The sdist holds the package and its metadata, not the registry, docs or papers. Without
# this it packed the whole repository, and PyPI refused v0.0.20's sdist as over 100 MB.
[tool.hatch.build.targets.sdist]
include = ["/openinterpretability", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml"]

[tool.labinacan]
# This project's values for the generic code of the labinacan package (labinacan.config, #6629).
# [project] above gives the rest: the command, the description, the URLs and the maintainer.
name = "Open Interpretability"
package = "openinterpretability"
env_prefix = "OPENINTERPRETABILITY"  # environment variables are OPENINTERPRETABILITY_<NAME>
linear_team = "OPE"  # the Linear team that mirrors the GitHub issues (scripts/linear_sync.py)
maintainer = "8W9aG"  # the maintainer's GitHub login, whose issues agents may work
hf_dataset = "sackfield/open-interpretability-exchange"  # the public inputs (scripts/exchange.py)
# Left out of mutmut's copy of the repository: no unit test reads the 840 MB of records
# (scripts/mutation.py, #6631).
mutation_skip = ["wiki/experiments"]
# The files that a tool writes, which the checks of hand-written files skip (scripts/repo_config.py).
# The workflows whose failure issues an agent may work, under their fixed titles
# (scripts/issue_state.py). The link check is left out on purpose.
automatic_issue_workflows = ["reproduce-nightly.yml", "deploy.yml"]
# The files that a PR from anyone may add and still auto-merge: the records that CI measures
# again ("Reproduce records"). auto-merge.yml reads it from the base commit (#6992).
auto_merge_rule = "openinterpretability/core/record_kinds.py:reproducible"
# A change to this line is breaking (scripts/changelog.py next): the protocol's version, since
# the same evidence can then get another verdict (docs/PROTOCOL.md §6).
breaking = { file = "openinterpretability/core/schemas.py", marker = "PROTOCOL_VERSION =" }
# The kinds of page that scripts/a11y_check.py opens first: a model, a layer, a neuron and
# an experiment.
a11y_pages = ["models/*/index.html", "models/*/L*/index.html", "models/*/L*/N*.html", "models/*/L*/N*-*/*.html"]
# A pull request that changes only these folders runs no lint and tests (labinacan-ci.yml).
data_only = ["wiki/"]
generated = [
  "wiki/*",  # the experiment pages and records
  "docs/analyses/*.jsonl",  # analysis rows
  "data/pole-effects/*.json",  # open-interpretability pole-effects
  "data/concept-maps/*.json",  # open-interpretability map (#4422)
  "posts/*/media/data.json",  # a post's measured figure data (scripts/explain_post_data.py)
  "benchmark/*.jsonl",  # frozen benchmark data (open-interpretability benchmark freeze)
  "hf_models/*.jsonl",  # dictionary training logs
]

[tool.labinacan.exchange]
# What scripts/exchange.py keeps back from the Hugging Face dataset, and its card's lines.
# Names under exchange/ that a command writes and no analysis reads. `bench` also holds the
# benchmark's private test probes, so it is never published.
outputs = [
  "bench", "bench-dev", "bench-redteam", "code-detection", "dream-arms", "dreams", "gpt2-spd",
  "language-detection", "rescore-pilot", "score-backfill", "spd-up-neurons.json",
]
contents = "Examples are SPD checkpoints and training logs, reviewer prompts and probe sets, and corpus samples."
terms = """Text in these files quotes the corpora that the scans read, under their own terms. Examples
are pile-10k (bigscience-bloom-rail-1.0, each Pile component under its own) and
FineWeb-Edu (ODC-BY). Model outputs and code-generated files are under the repository's MIT
licence. Pile corpus files themselves are not included."""

[tool.labinacan.exchange.unpublished]
"probe-comparison/*.pile.jsonl" = "pile-10k excerpts: the Pile corpus is not published (docs/experiments.md). scripts/probe_comparison.py writes them again from pile-10k."

[tool.labinacan.brand]
# The brand: the mark, the wordmark and the social image (labinacan.site.brand, #6629).
folder = "builder/brand"  # the brand's files, inside the package
tile = "#0F172A"  # the mark's tile: Tailwind's slate-900
ink = { light = "#0F172A", dark = "#F8FAFC" }  # the wordmark: slate-900, and slate-50 in dark mode
# The mark's colours: the model layouts' own yellow, orange and blue (#4465). They are the
# NEEDS_REVISION and REJECTED statuses and the negative pole (builder/palette.py), and
# tests/test_brand.py checks that. VERIFIED's blue is too dark for the dark tile.
colours = { yellow = "#FDE047", orange = "#F97316", blue = "#0284C7" }
# The mark is a 3 x 3 layer map, as the site's model pages draw one. Each cell is
# [column, row, thirds filled, colour]. An empty cell is a faint square.
cells = [
  [0, 0, 3, "yellow"], [1, 0, 1, "blue"], [2, 0, 2, "orange"],
  [0, 1, 1, "orange"], [1, 1, 3, "blue"], [2, 1, 0, ""],
  [0, 2, 2, "blue"], [1, 2, 0, ""], [2, 2, 3, "orange"],
]

[tool.labinacan.size_budget]
# scripts/repo_size.py warns in CI past these, and never fails (issue #3254). 1,000 MB is
# GitHub's recommended largest repository. Where records live in the long term is open.
tracked_mb = 1000
files = 20000

[tool.openinterpretability]
# Models `open-interpretability next` explores: most draws go to the smallest model whose share is
# below `coverage_target` verified (default 80%), the rest to the others (`others_share`, default 0.2;
# openinterpretability/planner_models.py). Keep in
# sync with ALLOWED_MODELS in .github/workflows/ci.yml (tests/test_planner.py checks), so
# CI can reproduce every record the planner asks for. A new model follows
# docs/adding-a-model.md first, with `open-interpretability model-check`.
# LINT.IfChange
models = ["Qwen/Qwen2.5-0.5B", "Qwen/Qwen2.5-1.5B", "openai-community/gpt2", "EleutherAI/pythia-70m"]
# LINT.ThenChange(.github/workflows/ci.yml)
# Models that may be audited but that CI can't run: every record must be signed, and
# reproduction trusts the signature (openinterpretability.planner.signed_models). Not explored.
signed_models = ["meta-llama/Llama-3.1-8B-Instruct"]

[tool.openinterpretability.window_tokens]
# Scan window for models that read fewer positions than the corpus's longest documents.
# GPT-2 reads 1,024, but its transcoders fit only 128 (harness/dictionaries.py), and the
# learned-basis baseline compares latents with neuron poles scanned the same way.
"openai-community/gpt2" = 128

[tool.openinterpretability.reproduce_floor]
# An absolute term, in activation units, that `open-interpretability reproduce` adds to the
# tolerance of a neuron pole of the model. Pythia-70m's activations move by up to 0.0049
# in float32 between machines and thread counts, whatever the pole's scale. A negative
# pole's scale is at most 0.17 (GELU), so that move fails the scale-relative tolerance.
# Twice the largest move measured (docs/analyses/neuron-float32-floor.md, #4187).
"EleutherAI/pythia-70m" = 0.01

# The terms of each model in `models` (openinterpretability.core.licenses.ModelLicense), which each
# model's site page shows. `license` and `gated` come from the model's Hub page, and
# `publishing_allowed` is our reading of the licence text. Checked on 2026-11-05.
# tests/test_planner.py checks that every configured model has an entry.
[tool.openinterpretability.licenses."Qwen/Qwen2.5-0.5B"]
license = "apache-2.0"
url = "https://huggingface.co/Qwen/Qwen2.5-0.5B/blob/main/LICENSE"
gated = false
publishing_allowed = true

[tool.openinterpretability.licenses."Qwen/Qwen2.5-1.5B"]
license = "apache-2.0"
url = "https://huggingface.co/Qwen/Qwen2.5-1.5B/blob/main/LICENSE"
gated = false
publishing_allowed = true

[tool.openinterpretability.licenses."openai-community/gpt2"]
license = "mit"
url = "https://github.com/openai/gpt-2/blob/master/LICENSE"
gated = false
publishing_allowed = true
conditions = "OpenAI's modified MIT licence asks users to say that content was created with GPT-2."

[tool.openinterpretability.licenses."meta-llama/Llama-3.1-8B-Instruct"]
license = "llama3.1"
url = "https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct/blob/main/LICENSE"
gated = true
publishing_allowed = true
conditions = "The Llama 3.1 Community License asks that published work show \"Built with Llama\", and that use follow Meta's Acceptable Use Policy."

[tool.openinterpretability.licenses."EleutherAI/pythia-70m"]
license = "apache-2.0"
url = "https://huggingface.co/EleutherAI/pythia-70m"
gated = false
publishing_allowed = true

# Ruff, coverage, diff-cover and PyMarkdown read their own files: ruff.toml, .coveragerc,
# .diff-cover.toml and .pymarkdown.yml, which hold no value of a project (#6630). The tables
# below stay here: pytest, mypy and mutmut name this project's paths, and interrogate's
# fail-under is this project's ratchet.

[tool.pytest.ini_options]
# The package's docstring examples run too (#5356). tests/test_doctests.py checks that each
# public function has one.
testpaths = ["tests", "openinterpretability"]
addopts = "-ra --doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
# A hang fails within three minutes, dumping every thread's stack and naming the test.
# "thread" because the hangs block in C (a semaphore wait), where SIGALRM never fires.
# 60 s ended slow tests too: a whole-site build reads every literature review and paper,
# and under coverage on a 2-core CI runner one took over 55 s (#6561).
timeout = 180
timeout_method = "thread"

[tool.mypy]
# Type checks, ratcheted in package by package (#3162). Only the paths in `files` are
# checked, and strictly. Add a package here once its strict errors are fixed.
files = ["openinterpretability/core"]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
# Imported modules outside `files` are read for their types but not reported.
follow_imports = "silent"
# torch, transformers and other libraries ship no stubs for some modules.
ignore_missing_imports = true

# schemas.py re-exports the models that the record schema is built from. Other modules
# import them from there, so its imports count as exports.
[[tool.mypy.overrides]]
module = "openinterpretability.core.schemas"
implicit_reexport = true

[tool.interrogate]
# Docstring coverage of openinterpretability/ and scripts/, private functions included (#3938).
# Raise fail-under as coverage rises, to 100, never lower it. Magic methods and __init__ are
# skipped: a class's docstring describes its constructor's arguments.
fail-under = 86
ignore-magic = true
ignore-init-method = true
ignore-private = false
ignore-semiprivate = false
ignore-module = false

[tool.mutmut]
# Mutation testing of the code that decides verdicts (#5763): `make mutation`, by hand.
# source_paths copies the whole package into mutants/, so the tests can import it.
# only_mutate limits the mutants to the verdict code.
source_paths = ["openinterpretability"]
only_mutate = [
    "openinterpretability/core/stats.py",
    "openinterpretability/builder/standing.py",
    "openinterpretability/agents/reviewer.py",
    "openinterpretability/planner.py",
    "openinterpretability/builder/significance.py",
    "openinterpretability/core/errata.py",
    "openinterpretability/planner_states.py",
    "openinterpretability/planner_models.py",
    "openinterpretability/agents/review_measurements.py",
]
# The repository data that the selected tests read.
also_copy = ["wiki/circuits", ".github/workflows"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-o", "addopts=-ra", "-q"]
# A mutant's CPU budget is (its tests' measured time + timeout_constant) x 15 x 2 seconds.
# Each test process is a fork of a parent with a large heap, and the fork costs CPU time of
# its own, more on a loaded machine. With mutmut's default of 1, a mutant whose tests measure
# 0 s had 30 s, and a parallel run sometimes passed it (exit -24, SIGXCPU).
# That gave "timeout" in one run and "killed" in another (#6829). 10 gives such a mutant 300 s.
timeout_constant = 10
pytest_add_cli_args_test_selection = [
    "tests/test_errata_edges.py",
    "tests/test_planner_states.py",
    "tests/test_planner_models.py",
    "tests/test_core_stats.py",
    "tests/test_builder_significance.py",
    "tests/test_covariance.py",
    "tests/test_builder_standing.py",
    "tests/test_agents_reviewer.py",
    "tests/test_verdict_regression.py",
    "tests/test_planner.py",
    "tests/test_planner_circuits.py",
    "tests/test_planner_explanations.py",
    "tests/test_planner_sisters.py",
    "tests/test_planner_superpositions.py",
    "tests/test_planner_heads.py",
    "tests/test_planner_claims.py",
    "tests/test_planner_models.py",
    "tests/test_draw_steps.py",
    "tests/test_agents.py",
    "tests/test_fence.py",
    "tests/test_probe_hints.py",
    "tests/test_length_rule.py",
    "tests/test_annotations.py",
    "tests/test_prior_art.py",
    "tests/test_inverse_claims.py",
    "tests/test_explanation_scores.py",
]
