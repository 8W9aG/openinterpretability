[project]
name = "openinterp"
dynamic = ["version"]
description = "Open Interpretability: an agent-audited mechanistic interpretability registry for native neurons in open-weight models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield", email = "will.sackfield@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "click>=8.1.0",
]

[project.scripts]
openinterp = "openinterp.cli:main"

[dependency-groups]
dev = [
    "pagefind[bin]>=1.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version is read from openinterp/__init__.py; reinstall when it changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "openinterp/__init__.py" }]

[tool.hatch.version]
path = "openinterp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openinterp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
