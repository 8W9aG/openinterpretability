[project]
name = "open-interpretability"
dynamic = ["version"]
description = "Open Interpretability: an agent-run mechanistic interpretability lab, with an audited registry of native neurons in open-weight models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield", email = "will.sackfield+openinterpretability@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "torch>=2.2.0",
    "transformers>=5.22.2",
    "accelerate>=0.30.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pyarrow>=26.0.1",
    "duckdb>=1.0.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "fasttext-predict>=0.9.2",
    "magika>=1.0.3,<2",
    "nltk>=3.8",
    "tldextract>=5.1",
    "presidio-analyzer>=2.2",
    "spacy-curated-transformers>=0.3,<1",
    "markdown-it-py>=4.0",
    # LaTeX maths in papers, typeset at build time as MathML (#4211).
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81.1",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.25.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-scala>=0.26.11",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-haskell>=0.24.1",
    # Scans on Apple's Neural Engine (openinterpretability/harness/ane/, docs/experiments.md, Devices).
    "coremltools>=9.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://open-interpretability.com/"  # the site; builder and deploy read it
Repository = "https://github.com/8W9aG/openinterpretability"
X = "https://x.com/openinterpret"  # the footer and twitter:site (#5389)

[project.scripts]
open-interpretability = "openinterpretability.cli:main"

[project.optional-dependencies]
# `open-interpretability build` makes the site's search index with Pagefind.
site = ["pagefind[bin]>=1.3.0"]
# `open-interpretability map` lays out a model's studied neurons by meaning (#4422).
map = ["sentence-transformers>=5.0", "umap-learn>=0.5.7", "leidenalg>=0.10.2", "igraph>=0.11"]
mcp = [
    "mcp>=2.0",
]

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    "interrogate>=1.7.0",
    "mcp>=2.0",
    "mypy>=1.13",
    "pagefind[bin]>=1.3.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=8.0.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "vulture>=2.16",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The version is read from openinterpretability/__init__.py; reinstall when it changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "openinterpretability/__init__.py" }]

[tool.hatch.version]
path = "openinterpretability/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openinterpretability"]

# The project's settings (`[tool.openinterpretability]` below) travel with an install, so
# commands run outside a clone read the same models, windows and licences (#3693).
[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "openinterpretability/data/pyproject.toml"

# The sdist holds the package and its metadata, not the registry, docs or papers. Without
# this it packed the whole repository, and PyPI refused v0.0.20's sdist as over 100 MB.
[tool.hatch.build.targets.sdist]
include = ["/openinterpretability", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml"]

[tool.openinterpretability]
# Models `open-interpretability next` explores: most draws go to the smallest model whose share is
# below `coverage_target` verified (default 80%), the rest to the others (`others_share`, default 0.2;
# openinterpretability/planner_models.py). Keep in
# sync with ALLOWED_MODELS in .github/workflows/ci.yml (tests/test_planner.py checks), so
# CI can reproduce every record the planner asks for. A new model also needs the checks
# under "Models" in TODO.md first.
# LINT.IfChange
models = ["Qwen/Qwen2.5-0.5B", "Qwen/Qwen2.5-1.5B", "openai-community/gpt2", "EleutherAI/pythia-70m"]
# LINT.ThenChange(.github/workflows/ci.yml)
# Models that may be audited but that CI can't run: every record must be signed, and
# reproduction trusts the signature (openinterpretability.planner.signed_models). Not explored.
signed_models = ["meta-llama/Llama-3.1-8B-Instruct"]

[tool.openinterpretability.size_budget]
# scripts/repo_size.py warns in CI past these, and never fails (issue #3254). 1,000 MB is
# GitHub's recommended largest repository. Where records live in the long term is open.
tracked_mb = 1000
files = 20000

[tool.openinterpretability.window_tokens]
# Scan window for models that read fewer positions than the corpus's longest documents.
# GPT-2 reads 1,024, but its transcoders fit only 128 (harness/dictionaries.py), and the
# learned-basis baseline compares latents with neuron poles scanned the same way.
"openai-community/gpt2" = 128

[tool.openinterpretability.reproduce_floor]
# An absolute term, in activation units, that `open-interpretability reproduce` adds to the
# tolerance of a neuron pole of the model. Pythia-70m's activations move by up to 0.0049
# in float32 between machines and thread counts, whatever the pole's scale. A negative
# pole's scale is at most 0.17 (GELU), so that move fails the scale-relative tolerance.
# Twice the largest move measured (docs/analyses/neuron-float32-floor.md, #4187).
"EleutherAI/pythia-70m" = 0.01

# The terms of each model in `models` (openinterpretability.core.licenses.ModelLicense), which each
# model's site page shows. `license` and `gated` come from the model's Hub page, and
# `publishing_allowed` is our reading of the licence text. Checked on 2026-11-05.
# tests/test_planner.py checks that every configured model has an entry.
[tool.openinterpretability.licenses."Qwen/Qwen2.5-0.5B"]
license = "apache-2.0"
url = "https://huggingface.co/Qwen/Qwen2.5-0.5B/blob/main/LICENSE"
gated = false
publishing_allowed = true

[tool.openinterpretability.licenses."Qwen/Qwen2.5-1.5B"]
license = "apache-2.0"
url = "https://huggingface.co/Qwen/Qwen2.5-1.5B/blob/main/LICENSE"
gated = false
publishing_allowed = true

[tool.openinterpretability.licenses."openai-community/gpt2"]
license = "mit"
url = "https://github.com/openai/gpt-2/blob/master/LICENSE"
gated = false
publishing_allowed = true
conditions = "OpenAI's modified MIT licence asks users to say that content was created with GPT-2."

[tool.openinterpretability.licenses."meta-llama/Llama-3.1-8B-Instruct"]
license = "llama3.1"
url = "https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct/blob/main/LICENSE"
gated = true
publishing_allowed = true
conditions = "The Llama 3.1 Community License asks that published work show \"Built with Llama\", and that use follow Meta's Acceptable Use Policy."

[tool.openinterpretability.licenses."EleutherAI/pythia-70m"]
license = "apache-2.0"
url = "https://huggingface.co/EleutherAI/pythia-70m"
gated = false
publishing_allowed = true

[tool.pytest.ini_options]
# The package's docstring examples run too (#5356). tests/test_doctests.py checks that each
# public function has one.
testpaths = ["tests", "openinterpretability"]
addopts = "-ra --doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
# A hang fails within a minute, dumping every thread's stack and naming the test.
# "thread" because the hangs block in C (a semaphore wait), where SIGALRM never fires.
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
# Branch coverage of the package (#3166). `make coverage` and CI's "Lint and tests" job
# measure it; `make test` doesn't, because coverage makes the suite about twice as slow.
source = ["openinterpretability"]
branch = true

[tool.coverage.report]
# Just below the measured total (95.60% on 2026-11-21). Raise it as coverage rises, never
# lower it, up to 100 (#5855). The lines that a pull request changes are held to
# [tool.diff_cover] fail_under.
fail_under = 95
skip_covered = true
show_missing = true

[tool.diff_cover]
# The lines that a pull request changes must all be covered, or marked `# pragma: no cover`
# with a reason (#5855). `make coverage` and CI's diff-cover step read this with
# `-c pyproject.toml`, so the number is set only here.
fail_under = 100

[tool.mypy]
# Type checks, ratcheted in package by package (#3162). Only the paths in `files` are
# checked, and strictly. Add a package here once its strict errors are fixed.
files = ["openinterpretability/core"]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
# Imported modules outside `files` are read for their types but not reported.
follow_imports = "silent"
# torch, transformers and other libraries ship no stubs for some modules.
ignore_missing_imports = true

# schemas.py re-exports the models that the record schema is built from. Other modules
# import them from there, so its imports count as exports.
[[tool.mypy.overrides]]
module = "openinterpretability.core.schemas"
implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored from danyuchn/asd-ste100-skill as is; upstream owns its style.
extend-exclude = [".claude/skills/asd-ste100"]

[tool.ruff.lint]
# D: docstrings, held to the commenting skill (.claude/skills/commenting/SKILL.md).
# ERA: commented-out code.
# S: Bandit's security checks (flake8-bandit), ported to Ruff.
# RET and PLR1702 keep code flat (#3158): RET505-508 forbid an else after return, raise,
# continue or break, so a function returns early; PLR1702 allows at most 5 nested blocks.
# PLR1702 is a preview rule. explicit-preview-rules turns on only the preview rules named
# here, so no other rule changes with preview.
select = ["E", "F", "I", "B", "UP", "SIM", "D", "ERA", "S", "ARG", "RET", "PLR1702"]
preview = true
explicit-preview-rules = true
# Magic methods and __init__ are described by their class's docstring. D301 asks for r"""
# when a docstring has a backslash, but Click's `\b` (no rewrapping) must stay a real \b.
# S311: the random generators seed experiments and samples, never secrets.
# S603, S607: every subprocess call passes a list, never a shell string (S602 and S604 still
# apply), and runs a tool found on PATH (git, gh, ssh-keygen, uv). S603 flags every call.
ignore = ["D105", "D107", "D301", "S311", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"
# D417 checks an Args: section that exists. scripts/check_docstring_args.py requires one,
# and scripts/check_docstring_sections.py requires Returns:, Yields: and Raises: (#3938,
# #5361). Ruff's preview DOC rules stay off: they need preview for the whole linter.

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings (D1): a test's name says what it checks, and a docstring that
# restates it is noise (.claude/skills/commenting/SKILL.md). The other D rules apply.
# Tests assert (S101), and give token fields fixed strings that S105 and S106 read as
# passwords. S314 parses SVG, and S608 queries parquet files, that the test itself wrote.
# Fixtures requested only for their side effects, and stubs that must match what they
# replace, take arguments that they never read (ARG, #3165).
"tests/**" = ["D1", "S101", "S105", "S106", "S314", "S608", "ARG"]
# A notebook checks its state with assert before a long run.
"*.ipynb" = ["S101"]

[tool.interrogate]
# Docstring coverage of openinterpretability/ and scripts/, private functions included (#3938).
# Raise fail-under as coverage rises, to 100, never lower it. Magic methods and __init__ are
# skipped: a class's docstring describes its constructor's arguments.
fail-under = 86
ignore-magic = true
ignore-init-method = true
ignore-private = false
ignore-semiprivate = false
ignore-module = false

[tool.pymarkdown]
# The docs write one paragraph per line.
plugins.md013.enabled = false
# Keep a Changelog repeats `### Added` under each version.
plugins.md024.siblings_only = true
# A step's command block sits tight under its numbered list item in the skills.
plugins.md031.list_items = false
# The body of an agent definition is its prompt, and the PR template is a form. Neither starts with a title.
plugins.md041.enabled = false
# A code span here is often a model token, whose leading space is part of the token (` the`).
plugins.md038.enabled = false
# Skills, agents and Hub cards start with YAML front matter.
extensions.front-matter.enabled = true
